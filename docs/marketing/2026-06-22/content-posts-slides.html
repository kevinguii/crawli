<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli Content Posts — 2026-06-22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&family=Abril+Fatface&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Libre+Bodoni:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
  gap: 14px;
}

/* ── top bar ── */
.top-bar {
  width: 100%;
  max-width: 440px;
  display: flex;
  align-items: center;
  gap: 10px;
}
select {
  flex: 1;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  background: #1a1a1a;
  color: #ccc;
  font-size: 13px;
  cursor: pointer;
}
.nbtn {
  padding: 9px 14px;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  background: #1a1a1a;
  color: #aaa;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.nbtn:hover:not(:disabled) { background: #252525; color: #fff; }
.nbtn:disabled { opacity: .3; cursor: default; }

/* ── post label ── */
.post-label {
  width: 100%; max-width: 440px;
  font-size: 11px; color: #444;
  text-transform: uppercase; letter-spacing: .1em;
}

/* ── slide frame ── */
/* 9:16 full-screen vertical is the default since 2026-06-19 (TikTok-only). */
.frame {
  width: 100%; max-width: 440px;
  aspect-ratio: 9 / 16;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
}
.slide {
  display: none;
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
}
.slide.on { display: block; }

/* ── bottom bar ── */
.bot-bar {
  width: 100%; max-width: 440px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.slide-ctr { font-size: 12px; color: #444; }

/* ── cover-photo slide (gpt-image-2 full-bleed cover, default since 2026-06-19) ── */
.cover-photo { width:100%; height:100%; position:relative; overflow:hidden; }
.cover-photo .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
/* scrim keeps the overlaid headline legible regardless of the photo underneath */
.cover-photo .scrim { position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.30) 55%, rgba(0,0,0,.74) 100%); }
/* padding is % of frame width/height (scale-invariant) — right/bottom clearance
   keeps text out of TikTok's own UI chrome (right ~15%, bottom ~18-20%) */
.cover-photo .content { position:relative; z-index:1; height:100%;
  display:flex; flex-direction:column;
  padding: 7% 18% 9% 13%; color:#fff; }
.cover-photo.anchor-top .content { justify-content:flex-start; }
.cover-photo.anchor-bottom .content { justify-content:flex-end; padding-bottom: 20%; }
.cover-photo .badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 13px; border-radius:100px;
  font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  width:fit-content; background:rgba(255,255,255,.2);
}
.cover-photo .hook {
  font-size:34px; line-height:1.14; font-weight:800; margin:14px 0 0;
  text-shadow: 0 2px 20px rgba(0,0,0,.45);
}
.cover-photo .swipe {
  font-size:11px; opacity:.75; letter-spacing:.05em; text-transform:uppercase; margin-top:16px;
}

/* ── step layout: number-left ── */
.step-nl {
  width: 100%; height: 100%;
  padding: 28px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.step-nl .ghost-num {
  position: absolute; top: 14px; left: 20px;
  font-size: 110px; font-weight: 900; line-height: 1;
  opacity: .08; letter-spacing: -4px;
  user-select: none;
}
.step-nl .mid-visual {
  flex: 1;
  min-height: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 50px 0 12px;
  overflow: hidden;
}
.step-nl .text-block { display: flex; flex-direction: column; gap: 8px; }
.step-nl .s-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .5;
}
.step-nl .s-title {
  font-size: 26px; font-weight: 800; line-height: 1.2;
}
.step-nl .s-desc {
  font-size: 14px; line-height: 1.6; opacity: .75;
}

/* ── step layout: visual-hero (centered) ── */
.step-vh {
  width: 100%; height: 100%;
  padding: 28px 24px 28px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 16px;
  overflow: hidden;
}
.step-vh .s-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .45;
}
.step-vh .s-title {
  font-size: 24px; font-weight: 800; line-height: 1.25;
}
.step-vh .s-desc {
  font-size: 13.5px; line-height: 1.65; opacity: .72; max-width: 320px;
}

/* ── step layout: editorial (two-col) ── */
.step-ed {
  width: 100%; height: 100%;
  padding: 32px 28px 28px;
  display: flex; flex-direction: column;
  gap: 0;
  overflow: hidden;
}
.step-ed .ed-top {
  display: flex; align-items: flex-start; gap: 20px;
  margin-bottom: 20px;
}
.step-ed .ed-text { flex: 1; }
.step-ed .s-label {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; opacity: .45;
  margin-bottom: 10px;
}
.step-ed .ed-rule {
  height: 1px; background: rgba(255,255,255,.15);
  margin-bottom: 18px;
}
.step-ed .s-title {
  font-size: 25px; font-weight: 800; line-height: 1.22;
  margin-bottom: 12px;
}
.step-ed .s-desc {
  font-size: 13.5px; line-height: 1.65; opacity: .72;
}

/* ── cta slide ── */
.cta-slide {
  width: 100%; height: 100%;
  padding: 32px 28px 28px;
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
.cta-logo { margin-bottom: 12px; }
.cta-headline {
  font-size: 24px; font-weight: 800; line-height: 1.28;
  flex: 1; display: flex; align-items: center;
}
.cta-desc {
  font-size: 14px; line-height: 1.6; opacity: .8;
  border-top: 1px solid rgba(255,255,255,.18);
  padding-top: 14px; margin-top: 16px;
}
.cta-url {
  font-size: 12px; opacity: .4; margin-top: 8px; letter-spacing: .04em;
}

/* ── visual card (white bg, colored symbol) ── */
.vcrd {
  background: rgba(255,255,255,0.93);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.vcrd-sm { width: 90px; height: 90px; border-radius: 12px; }
.vcrd-md { width: 140px; height: 140px; }
.vcrd-lg { width: 180px; height: 180px; border-radius: 20px; }

/* ── colored clipart card (figurative scenes) ── */
.ccard { border-radius: 18px; box-shadow: 0 12px 30px rgba(0,0,0,.28); display: block; }
.step-nl .ccard, .step-vh .ccard, .step-ed .ccard { width: 200px; height: 200px; max-width: 90%; }
.cover .ccard { width: 168px; height: 168px; }

/* ── step layout: myth (struck-through myth, bright truth) ── */
.step-myth {
  width: 100%; height: 100%;
  padding: 34px 28px 28px;
  display: flex; flex-direction: column;
  justify-content: center; gap: 16px;
  position: relative; overflow: hidden;
}
.step-myth .ghost-myth-num {
  position: absolute; top: 10px; right: 18px;
  font-size: 100px; font-weight: 900; line-height: 1;
  opacity: .07; letter-spacing: -3px; user-select: none;
}
.step-myth .myth-label {
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; opacity: .5;
}
.step-myth .myth-text {
  font-size: 19px; font-weight: 700; line-height: 1.35;
  text-decoration: line-through; opacity: .42;
}
.step-myth .truth-label {
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; opacity: .65; margin-top: 4px;
}
.step-myth .truth-text {
  font-size: 22px; font-weight: 800; line-height: 1.32;
}

/* ── manifesto slide (oversized statement) ── */
.manifesto {
  width: 100%; height: 100%;
  padding: 38px 28px;
  display: flex; flex-direction: column; justify-content: center; gap: 16px;
}
.manifesto .big {
  font-weight: 800; font-size: 38px; line-height: 1.1; letter-spacing: -1px;
}
.manifesto .big .hl { font-style: italic; }
.manifesto .footnote { font-size: 12px; opacity: .5; letter-spacing: .02em; }

/* ── pull-quote slide ── */
.quote {
  width: 100%; height: 100%;
  padding: 38px 28px;
  display: flex; flex-direction: column; justify-content: center;
}
.quote .mark {
  font-size: 96px; line-height: .5; opacity: .2; margin-bottom: 8px;
}
.quote blockquote {
  font-style: italic; font-weight: 600; font-size: 27px; line-height: 1.26; letter-spacing: -.5px;
}
.quote .attribution {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .5; margin-top: 18px;
}

/* ── stat slide (one big number) ── */
.stat-slide {
  width: 100%; height: 100%;
  padding: 36px 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 14px;
}
.stat-slide .stat-num { font-size: 76px; font-weight: 900; line-height: 1; }
.stat-slide .stat-context { font-size: 15px; line-height: 1.5; opacity: .78; max-width: 300px; }

/* ── Minimalism & Swiss Style accent (new axis, used sparingly — post 1 only) ── */
.swiss-rule { height: 2px; background: rgba(255,255,255,.4); }
</style>
</head>
<body>

<div class="top-bar">
  <button class="nbtn" id="pp" onclick="changePost(-1)">← Post</button>
  <select id="sel" onchange="jumpPost(+this.value)">
    <option value="0">1 · Seller Scam Myths 🚩</option>
    <option value="1">2 · Selvedge Denim Facts 🧵</option>
    <option value="2">3 · Y2K Fashion Trends 📟</option>
    <option value="3">4 · 1960s Fashion Guide ☮️</option>
    <option value="4">5 · Handmade vs Machine Made 🧵</option>
    <option value="5">6 · Wool Quality Facts 🐑</option>
    <option value="6">7 · Best Niches for Reselling 📦</option>
    <option value="7">8 · The Search Problem 🔎</option>
  </select>
  <button class="nbtn" id="np" onclick="changePost(1)">Post →</button>
</div>

<div class="post-label" id="plabel"></div>
<div class="frame" id="frame"></div>

<div class="bot-bar">
  <button class="nbtn" id="ps" onclick="changeSlide(-1)">←</button>
  <span class="slide-ctr" id="sctr"></span>
  <button class="nbtn" id="ns" onclick="changeSlide(1)">→</button>
</div>

<script>
// ─── Crawli logo (inline, unique gradient ID) ─────────────────────────────
const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="160" height="48">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E24B4A"/>
      <stop offset="25%" stop-color="#E84D1D"/>
      <stop offset="50%" stop-color="#D85A30"/>
      <stop offset="75%" stop-color="#EF9F27"/>
      <stop offset="100%" stop-color="#FAC775"/>
    </linearGradient>
  </defs>
  <text x="100" y="46" text-anchor="middle"
    font-family="'Trebuchet MS','Segoe UI',sans-serif"
    font-size="52" font-weight="700" letter-spacing="-1" fill="url(#cg)">Crawli</text>
</svg>`;

// ─── SVG visual cards (white bg, post-accent color) ──────────────────────
// Each returns inner SVG content at viewBox="0 0 180 180"
const V = {
  eye: c=>`<svg viewBox="0 0 180 180"><rect width="180" height="180" rx="16" fill="white"/>
    <path d="M15 90 Q45 40 90 40 Q135 40 165 90 Q135 140 90 140 Q45 140 15 90Z" fill="${c}" opacity=".12" stroke="${c}" stroke-width="4"/>
    <circle cx="90" cy="90" r="28" fill="${c}" opacity=".2" stroke="${c}" stroke-width="3"/>
    <circle cx="90" cy="90" r="14" fill="${c}" opacity=".6"/>
    <circle cx="90" cy="90" r="5" fill="${c}"/>
    <circle cx="80" cy="82" r="4" fill="white" opacity=".5"/>
  </svg>`,

  globe: c=>`<svg viewBox="0 0 180 180"><rect width="180" height="180" rx="16" fill="white"/>
    <circle cx="90" cy="90" r="58" fill="${c}" opacity=".1" stroke="${c}" stroke-width="4"/>
    <ellipse cx="90" cy="90" rx="26" ry="58" fill="none" stroke="${c}" stroke-width="3" opacity=".5"/>
    <line x1="32" y1="90" x2="148" y2="90" stroke="${c}" stroke-width="3" opacity=".5"/>
    <path d="M40 64 Q90 78 140 64" fill="none" stroke="${c}" stroke-width="2.5" opacity=".4"/>
    <path d="M40 116 Q90 102 140 116" fill="none" stroke="${c}" stroke-width="2.5" opacity=".4"/>
  </svg>`,

  tag: c=>`<svg viewBox="0 0 180 180"><rect width="180" height="180" rx="16" fill="white"/>
    <path d="M50 40 L130 40 L150 90 L130 140 L50 140 Z" fill="${c}" opacity=".12" stroke="${c}" stroke-width="3.5"/>
    <circle cx="75" cy="62" r="8" fill="none" stroke="${c}" stroke-width="3.5"/>
    <line x1="75" y1="70" x2="75" y2="88" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3" opacity=".5"/>
    <line x1="70" y1="100" x2="130" y2="100" stroke="${c}" stroke-width="2" opacity=".3"/>
    <line x1="70" y1="112" x2="120" y2="112" stroke="${c}" stroke-width="2" opacity=".2"/>
    <line x1="70" y1="124" x2="110" y2="124" stroke="${c}" stroke-width="2" opacity=".15"/>
  </svg>`,

  medal: c=>`<svg viewBox="0 0 180 180"><rect width="180" height="180" rx="16" fill="white"/>
    <circle cx="90" cy="115" r="48" fill="${c}" opacity=".12" stroke="${c}" stroke-width="4"/>
    <circle cx="90" cy="115" r="35" fill="${c}" opacity=".15"/>
    <text x="90" y="115" text-anchor="middle" dominant-baseline="central" font-size="28" fill="${c}" font-weight="900" font-family="system-ui" opacity=".7">★</text>
    <path d="M70 68 L62 28 L90 40 L118 28 L110 68" fill="${c}" opacity=".3" stroke="${c}" stroke-width="3"/>
    <line x1="72" y1="28" x2="108" y2="28" stroke="${c}" stroke-width="2.5" opacity=".3"/>
  </svg>`,

  search: c=>`<svg viewBox="0 0 180 180"><rect width="180" height="180" rx="16" fill="white"/>
    <circle cx="80" cy="78" r="42" fill="${c}" opacity=".1" stroke="${c}" stroke-width="5"/>
    <line x1="112" y1="110" x2="150" y2="148" stroke="${c}" stroke-width="7" stroke-linecap="round"/>
    <line x1="62" y1="72" x2="98" y2="72" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <line x1="62" y1="86" x2="88" y2="86" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  </svg>`,
};

// ─── COLORED CLIPART SYSTEM (figurative scenes, canonical proportions) ───────
const P = { cream:'#f7efe0', skin:'#e7ad84', hair:'#3a2a20', teal:'#2a9d8f', tealD:'#23867a',
  denim:'#46587a', denimD:'#3a496a', shoe:'#2b2b2b',
  g1:'#e76f51', g1D:'#c75a3f', g2:'#e9c46a', g2D:'#caa53b', g3:'#6d9eeb', g3D:'#5683c4',
  metal:'#9aa0a6', floor:'#ece1cd', door:'#e3d4ba', frame:'#b79b73' };

function head(cx,cy){ return `<circle cx="${cx}" cy="${cy}" r="13" fill="${P.skin}"/>
  <path d="M${cx-13} ${cy-1} q-2-17 14-17 q17 0 13 18 q-4-8 -13-8 q-9 0 -14 7z" fill="${P.hair}"/>`; }

function cardBg(floorY=160){ return `<rect width="200" height="200" rx="18" fill="${P.cream}"/><rect y="${floorY}" width="200" height="${200-floorY}" fill="${P.floor}"/>`; }

function tee(cx, topY, color, collar, s=1, bodyH=46){
  const hw=19*s, nk=8*s, bh=12*s, shY=topY+4*s, slY=topY+12*s, ubY=topY+14*s, hemY=topY+bodyH, dip=topY+7*s;
  return `<path d="M${cx-nk} ${topY} L${cx-hw} ${shY} L${cx-hw+5*s} ${slY} L${cx-bh} ${ubY} L${cx-bh} ${hemY} L${cx+bh} ${hemY} L${cx+bh} ${ubY} L${cx+hw-5*s} ${slY} L${cx+hw} ${shY} L${cx+nk} ${topY} Q${cx} ${dip} ${cx-nk} ${topY} Z" fill="${color}"/>`
    + `<path d="M${cx-nk} ${topY} Q${cx} ${dip} ${cx+nk} ${topY}" fill="none" stroke="${collar}" stroke-width="${2.2*s}" stroke-linecap="round"/>`;
}

function hook(cx, topY){ return `<path d="M${cx} ${topY} L${cx} ${topY-9} q0 -3 3 -3" fill="none" stroke="${P.metal}" stroke-width="2"/>`; }

function personReach(armTo){ const [hx,hy]=armTo;
  return `<path d="M150 120 l-4 38 l9 0 l5-30 z" fill="${P.denimD}"/><path d="M161 120 l3 38 l9 0 l-2-38 z" fill="${P.denim}"/>
    <ellipse cx="151" cy="161" rx="8" ry="4" fill="${P.shoe}"/><ellipse cx="170" cy="161" rx="8" ry="4" fill="${P.shoe}"/>
    <path d="M147 92 q14-6 26 0 l3 30 q-16 6 -32 0 z" fill="${P.teal}"/>
    <path d="M171 98 l9 22 l-7 3 l-9-21 z" fill="${P.teal}"/><circle cx="177" cy="123" r="5.5" fill="${P.skin}"/>
    <path d="M150 100 Q${(150+hx)/2} ${Math.min(hy,100)-6} ${hx+6} ${hy} L${hx+4} ${hy+8} Q${(150+hx)/2} ${Math.min(hy,100)+4} 152 108 Z" fill="${P.teal}"/>
    <circle cx="${hx}" cy="${hy}" r="6" fill="${P.skin}"/>${head(160,80)}`;
}

const SC = {
  inspect: `<svg class="ccard" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    ${cardBg(162)}
    <circle cx="44" cy="42" r="13" fill="${P.g2}"/><g stroke="${P.g2}" stroke-width="3" stroke-linecap="round"><line x1="44" y1="18" x2="44" y2="10"/><line x1="24" y1="30" x2="18" y2="25"/><line x1="64" y1="30" x2="70" y2="25"/><line x1="22" y1="54" x2="16" y2="59"/></g>
    ${tee(84,64,P.denim,P.denimD,1.35,64)}
    <path d="M150 122 l-4 36 l9 0 l5-29 z" fill="${P.denimD}"/><path d="M161 122 l3 36 l9 0 l-2-37 z" fill="${P.denim}"/>
    <ellipse cx="151" cy="161" rx="8" ry="4" fill="${P.shoe}"/><ellipse cx="170" cy="161" rx="8" ry="4" fill="${P.shoe}"/>
    <path d="M147 94 q14-6 26 0 l3 30 q-16 6 -32 0 z" fill="${P.teal}"/>
    <path d="M172 100 l8 20 l-7 3 l-8-20 z" fill="${P.teal}"/><circle cx="177" cy="123" r="5.5" fill="${P.skin}"/>
    <path d="M150 100 Q132 70 114 70 L112 80 Q134 82 152 108 Z" fill="${P.teal}"/><circle cx="113" cy="73" r="6" fill="${P.skin}"/>
    ${head(160,82)}</svg>`,

  rack: `<svg class="ccard" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    ${cardBg(160)}
    <rect x="32" y="50" width="124" height="5" rx="2.5" fill="${P.metal}"/><rect x="35" y="54" width="5" height="108" fill="${P.metal}"/><rect x="25" y="160" width="29" height="5" rx="2.5" fill="${P.metal}"/>
    ${hook(66,58)}${tee(66,58,P.g1,P.g1D,1,46)} ${hook(98,58)}${tee(98,58,P.g2,P.g2D,1,46)} ${hook(130,58)}${tee(130,58,P.g3,P.g3D,1,46)}
    ${personReach([118,104])}</svg>`,

  walkin: `<svg class="ccard" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    ${cardBg(162)}
    <rect x="128" y="34" width="52" height="128" fill="${P.door}"/><rect x="120" y="28" width="9" height="134" fill="${P.frame}"/><rect x="120" y="28" width="64" height="8" fill="${P.frame}"/>
    <path d="M86 120 l-13 36 l9 0 l12-30 z" fill="${P.denimD}"/><path d="M97 120 l12 33 l9 0 l-7-35 z" fill="${P.denim}"/>
    <ellipse cx="73" cy="158" rx="8" ry="4" fill="${P.shoe}"/><ellipse cx="113" cy="155" rx="8" ry="4" fill="${P.shoe}"/>
    <path d="M82 90 q14-6 26 0 l3 32 q-16 6 -32 0 z" fill="${P.teal}"/>
    <path d="M84 96 l-13 19 l7 4 l12-18 z" fill="${P.teal}"/><circle cx="73" cy="118" r="5.5" fill="${P.skin}"/>
    <path d="M106 98 l11 20 l-6 3 l-11-19 z" fill="${P.teal}"/><circle cx="113" cy="121" r="5.5" fill="${P.skin}"/>

// helper: wrap SVG in a visual card div
function vcrd(svgFn, color, size='md') {
  return `<div class="vcrd vcrd-${size}">${svgFn(color)}</div>`;
}

// ─── CTA slide HTML ───────────────────────────────────────────────────────────
function ctaHTML(s, post) {
  return `<div class="cta-slide" style="background:${post.bg}; color:${post.text}; align-items:center; text-align:center;">
    <div style="display:flex;justify-content:center;">${LOGO}</div>
    <div class="cta-headline" style="text-align:center;">${s.headline}</div>
    <div>
      <div class="cta-desc" style="text-align:left;"><strong>Crawli:</strong> ${s.crawli}</div>
      <div class="cta-url">thecrawli.com</div>
    </div>
  </div>`;
}

// ─── FONT TRACKS (typography axis — pick a genuinely different pairing per
// batch; never default to plain system-sans, never reuse the last batch's
// pairing). This batch introduces two new tracks beyond the old
// standard/editorial binary: ─────────────────────────────────────────────
const FONT_TRACKS = {
  'bold-modern': {
    title: "font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-0.5px;",
    label: "font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:.12em;",
    desc:  "font-family:'Manrope',sans-serif;font-weight:400;"
  },
  'vintage-statement': {
    title: "font-family:'Abril Fatface',serif;font-weight:400;letter-spacing:-0.5px;",
    label: "font-family:'Merriweather',serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;",
    desc:  "font-family:'Merriweather',serif;font-weight:300;"
  },
  // third track, introduced for posts 3-8 so the batch does not lean on only
  // two pairings — Libre Bodoni is display-only (headlines), Public Sans
  // carries every label/body line and is one of the most legible Google Fonts
  // at small mobile sizes, directly addressing the "readable fonts" note.
  'magazine': {
    title: "font-family:'Libre Bodoni',serif;font-weight:700;letter-spacing:-0.3px;",
    label: "font-family:'Public Sans',sans-serif;font-weight:600;letter-spacing:.1em;",
    desc:  "font-family:'Public Sans',sans-serif;font-weight:400;"
  }
};
const edTitle = (post) => (FONT_TRACKS[post.typography] || {}).title || '';
const edLabel = (post) => (FONT_TRACKS[post.typography] || {}).label || '';
const edDesc  = (post) => (FONT_TRACKS[post.typography] || {}).desc  || '';

// visual(s, c, size): a slide can carry either svgFn (symbol icon, white card) or
// sceneKey (figurative clipart, looked up in SC) — sceneKey takes priority.
function visual(s, c, size) {
  if (s.sceneKey && SC[s.sceneKey]) return SC[s.sceneKey];
  return vcrd(s.svgFn, c, size);
}

function renderCoverPhoto(s, post) {
  const anchor = post.textPlacement === 'top' ? 'anchor-top' : 'anchor-bottom';
  return `<div class="cover-photo ${anchor}">
    <img class="bg" src="${s.img}" alt="">
    <div class="scrim"></div>
    <div class="content">
      <span class="badge">${s.badge}</span>
      <h1 class="hook" style="${edTitle(post)}">${s.title}</h1>
      <span class="swipe">${s.swipe || 'Swipe →'}</span>
    </div>
  </div>`;
}

function renderNumberLeft(s, post) {
  const c = post.color;
  return `<div class="step-nl" style="background:${post.bg}; color:${post.text};">
    <div class="ghost-num">${s.num}</div>
    <div class="mid-visual">${visual(s, c, 'md')}</div>
    <div class="text-block">
      <div class="s-label" style="${edLabel(post)}">${s.label}</div>
      <div class="s-title" style="${edTitle(post)}">${s.title}</div>
      <div class="s-desc" style="${edDesc(post)}">${s.desc}</div>
    </div>
  </div>`;
}

function renderVisualHero(s, post) {
  const c = post.color;
  return `<div class="step-vh" style="background:${post.bg}; color:${post.text};">
    <div class="s-label" style="${edLabel(post)}">${s.label}</div>
    ${visual(s, c, 'lg')}
    <div class="s-title" style="${edTitle(post)}">${s.title}</div>
    <div class="s-desc" style="${edDesc(post)}">${s.desc}</div>
  </div>`;
}

function renderEditorial(s, post) {
  const c = post.color;
  return `<div class="step-ed" style="background:${post.bg}; color:${post.text};">
    <div class="ed-top">
      <div class="ed-text">
        <div class="s-label" style="${edLabel(post)}">${s.label}</div>
      </div>
      ${visual(s, c, 'sm')}
    </div>
    <div class="ed-rule"></div>
    <div class="s-title" style="${edTitle(post)}">${s.title}</div>
    <div class="s-desc" style="${edDesc(post)}">${s.desc}</div>
  </div>`;
}

function renderMyth(s, post) {
  const swiss = post.styleMovement === 'swiss';
  return `<div class="step-myth" style="background:${post.bg}; color:${post.text};">
    <div class="ghost-myth-num">${s.num}</div>
    <div class="myth-label" style="${edLabel(post)}">${s.label}</div>
    <div class="myth-text" style="${edTitle(post)}">${s.myth}</div>
    ${swiss ? '<div class="swiss-rule"></div>' : ''}
    <div class="truth-label" style="${edLabel(post)}">Reality</div>
    <div class="truth-text" style="${edTitle(post)}">${s.truth}</div>
  </div>`;
}

function renderManifesto(s, post) {
  return `<div class="manifesto" style="background:${post.bg}; color:${post.text};">
    <div class="big" style="${edTitle(post)}">${s.text}</div>
    ${s.footnote ? `<div class="footnote">${s.footnote}</div>` : ''}
  </div>`;
}

function renderQuote(s, post) {
  return `<div class="quote" style="background:${post.bg}; color:${post.text};">
    <div class="mark">&ldquo;</div>
    <blockquote style="${edTitle(post)}">${s.quote}</blockquote>
    ${s.attribution ? `<div class="attribution">${s.attribution}</div>` : ''}
  </div>`;
}

function renderStat(s, post) {
  const swiss = post.styleMovement === 'swiss';
  return `<div class="stat-slide" style="background:${post.bg}; color:${post.text};">
    ${swiss ? '<div class="swiss-rule" style="width:60px;"></div>' : ''}
    <div class="stat-num" style="${swiss ? 'font-variant-numeric:tabular-nums;' : ''}">${s.stat}</div>
    ${swiss ? '<div class="swiss-rule" style="width:60px;"></div>' : ''}
    <div class="stat-context">${s.context}</div>
  </div>`;
}

function buildSlideHTML(s, post) {
  if (s.type === 'cover-photo') return renderCoverPhoto(s, post);
  if (s.type === 'cta')         return ctaHTML(s, post);
  if (s.type === 'myth')        return renderMyth(s, post);
  if (s.type === 'manifesto')   return renderManifesto(s, post);
  if (s.type === 'pull-quote')  return renderQuote(s, post);
  if (s.type === 'stat')        return renderStat(s, post);
  const layout = post.stepLayout;
  if (layout === 'number-left')  return renderNumberLeft(s, post);
  if (layout === 'visual-hero')  return renderVisualHero(s, post);
  if (layout === 'editorial')    return renderEditorial(s, post);
  if (layout === 'myth')         return renderMyth(s, post);
  return renderVisualHero(s, post);
}

// ─── STATE + NAV ─────────────────────────────────────────────────────────────
let pi = 0, si = 0;

function render() {
  const post = posts[pi];
  const frame = document.getElementById('frame');
  frame.innerHTML = post.slides.map((s,i) =>
    `<div class="slide${i===si?' on':''}">${buildSlideHTML(s, post)}</div>`
  ).join('');
  document.getElementById('plabel').textContent = post.label;
  document.getElementById('sctr').textContent = `${si+1} / ${post.slides.length}`;
  document.getElementById('pp').disabled = pi === 0;
  document.getElementById('np').disabled = pi === posts.length-1;
  document.getElementById('ps').disabled = si === 0;
  document.getElementById('ns').disabled = si === post.slides.length-1;
  document.getElementById('sel').value = pi;
}

function changeSlide(d) {
  const n = si+d;
  if (n>=0 && n<posts[pi].slides.length) { si=n; render(); }
}
function changePost(d) {
  const n = pi+d;
  if (n>=0 && n<posts.length) { pi=n; si=0; render(); }
}
function jumpPost(v) { pi=+v; si=0; render(); }
function gotoSlide(v) { si=+v; render(); }

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') changeSlide(1);
  if(e.key==='ArrowLeft')  changeSlide(-1);
  if(e.key==='ArrowDown')  changePost(1);
  if(e.key==='ArrowUp')    changePost(-1);
});

render();
</script>
