<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli Tool Spotlight — Pilot (2026-07-09)</title>
<link rel="preconnect" href="https://api.fontshare.com">
<!-- Tool Spotlight pilot post 1: "Tools Resellers Actually Use" — a genuine "underrated
     tools" roundup, distinct from both the fact-carousel batches
     (docs/marketing/POSTS_README.md) and the Journey Series
     (docs/marketing/journey-series/README.md). Each slide names one real, specific,
     independently useful tool or trick (Google Lens reverse-image check, eBay's sold-
     listings filter, Google Trends) — Crawli is named directly as the 4th, given the same
     plain treatment as the other three, not hidden behind an aside. This is a DELIBERATE
     departure from the obfuscate-CI rule the rest of this project follows — see
     ../README.md "Naming policy" for the reasoning. Real free-licensed Unsplash photos (see
     images/CREDITS.md), no AI generation. Centered-stacked placement, minimal chrome.
     Font pairing: Satoshi (headings) + General Sans (body), via Fontshare — new to this
     project. Accent #f472b6 (soft pink), unused in visual-history.json as of this batch. -->
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0a0a0a;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px; gap: 14px;
}

.top-bar { width:100%; max-width:440px; display:flex; align-items:center; gap:10px; }
select { flex:1; padding:9px 12px; border-radius:8px; border:1px solid #2a2a2a; background:#1a1a1a; color:#ccc; font-size:13px; cursor:pointer; }
.nbtn { padding:9px 14px; border:1px solid #2a2a2a; border-radius:8px; background:#1a1a1a; color:#aaa; font-size:13px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.nbtn:hover:not(:disabled) { background:#252525; color:#fff; }
.nbtn:disabled { opacity:.3; cursor:default; }
.post-label { width:100%; max-width:440px; font-size:11px; color:#444; text-transform:uppercase; letter-spacing:.1em; }

.frame { width:100%; max-width:440px; aspect-ratio:4/5; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 24px 80px rgba(0,0,0,.7); }
.slide { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
.slide.on { display:block; }
.bot-bar { width:100%; max-width:440px; display:flex; align-items:center; justify-content:space-between; }
.slide-ctr { font-size:12px; color:#444; }

/* ════════════════════════════════════════════════════════════════════
   SPOTLIGHT-PHOTO — Tool Spotlight series template. Full-bleed real
   photo + scrim + a centered-stacked text block (vertically centered,
   not bottom- or top-anchored) — deliberately different placement from
   both the fact-carousel series' last batch (bottom-anchored full-bleed
   photo) and the Journey Series (bottom-anchor). Minimal chrome: a tiny
   numeric eyebrow, one short bold phrase, one short supporting line.
   ════════════════════════════════════════════════════════════════════ */
.spotlight-photo { width:100%; height:100%; position:relative; overflow:hidden; background:#111; }
.spotlight-photo .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.spotlight-photo .scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.30) 38%, rgba(0,0,0,.38) 62%, rgba(0,0,0,.60) 100%); }
.spotlight-photo .content { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10% 11%; color:#fdfaf6; }

.spotlight-photo .sp-eyebrow { font-family:'General Sans',sans-serif; font-size:12px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; }
.spotlight-photo .sp-headline { font-family:'Satoshi',sans-serif; font-weight:700; font-size:32px; line-height:1.18; text-shadow:0 2px 24px rgba(0,0,0,.6); }
.spotlight-photo .sp-sub { font-family:'General Sans',sans-serif; font-weight:400; font-size:15px; line-height:1.5; opacity:.88; margin-top:16px; max-width:88%; text-shadow:0 1px 12px rgba(0,0,0,.55); }
.spotlight-photo .sp-swipe { font-family:'General Sans',sans-serif; font-size:11px; font-weight:600; opacity:.7; letter-spacing:.1em; text-transform:uppercase; margin-top:22px; }

/* hook: bigger headline, no eyebrow */
.spotlight-photo.variant-hook .sp-headline { font-size:36px; }

/* tool: eyebrow number shown, standard sizing. Crawli's slide uses this same
   variant as the other three named tools — deliberately no special "reveal"
   treatment, since it reads as a peer recommendation, not a punchline. */
.spotlight-photo.variant-tool .sp-headline { font-size:30px; }

</style>
</head>
<body>

<div class="top-bar">
  <button class="nbtn" id="pp" onclick="changePost(-1)">← Post</button>
  <select id="sel" onchange="jumpPost(+this.value)">
    <option value="0">1 · Tools Resellers Actually Use 🧵</option>
  </select>
  <button class="nbtn" id="np" onclick="changePost(1)">Post →</button>
</div>

<div class="post-label" id="plabel"></div>
<div class="frame" id="frame"></div>

<div class="bot-bar">
  <button class="nbtn" id="ps" onclick="changeSlide(-1)">←</button>
  <span class="slide-ctr" id="sctr"></span>
  <button class="nbtn" id="ns" onclick="changeSlide(1)">→</button>
</div>

<script>
function renderSpotlightPhoto(s, post) {
  return `<div class="spotlight-photo variant-${s.variant}" style="--accent:${post.color}">
    <img class="bg" src="${s.img}" alt="">
    <div class="scrim"></div>
    <div class="content">
      ${s.eyebrow ? `<div class="sp-eyebrow">${s.eyebrow}</div>` : ''}
      <div class="sp-headline">${s.headline}</div>
      ${s.sub ? `<div class="sp-sub">${s.sub}</div>` : ''}
      ${s.swipe ? `<div class="sp-swipe">${s.swipe}</div>` : ''}
    </div>
  </div>`;
}

function buildSlideHTML(s, post) {
  return renderSpotlightPhoto(s, post);
}

// ─── POST DATA ──
const posts = [
  {
    label: 'TOOL SPOTLIGHT · RESELLERS',
    color: '#f472b6',
    fontClass: '',
    slides: [
      { variant:'hook', img:'images/slide-01-hook.jpg',
        headline:'5 tools resellers use before they buy or list anything.',
        swipe:'swipe →' },
      { variant:'tool', img:'images/slide-02-lens.jpg', eyebrow:'01',
        headline:'Google Lens',
        sub:'Screenshot the listing photo, reverse image search it. If it turns up on a wholesale site, it is not coming from someone’s closet.' },
      { variant:'tool', img:'images/slide-03-sold.jpg', eyebrow:'02',
        headline:'eBay’s sold listings filter',
        sub:'Advanced search, then filter to sold. The asking price means nothing. What it actually sold for is the only number that matters.' },
      { variant:'tool', img:'images/slide-04-trends.jpg', eyebrow:'03',
        headline:'Google Trends',
        sub:'Before sourcing heavy into a “hot” niche, check if interest is actually rising or if it was one viral post.' },
      { variant:'tool', img:'images/slide-05-crawli.jpg', eyebrow:'04',
        headline:'Crawli',
        sub:'Searches eBay, Poshmark, Mercari, Grailed, Depop, Vinted, StockX, ThredUp, and Vestiaire at once, with real per-platform profit math and alerts for exact brand, size, and price matches.' }
    ]
  }
];

// ─── NAV ENGINE (unchanged from existing batches) ──
let pIdx = 0, sIdx = 0;
function renderPost() {
  const post = posts[pIdx];
  const frame = document.getElementById('frame');
  frame.innerHTML = post.slides.map(s => `<div class="slide ${post.fontClass || ''}">${buildSlideHTML(s, post)}</div>`).join('');
  document.getElementById('plabel').textContent = post.label;
  document.getElementById('sel').value = pIdx;
  sIdx = 0;
  updateSlide();
}
function updateSlide() {
  const post = posts[pIdx];
  document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('on', i === sIdx));
  document.getElementById('sctr').textContent = `${sIdx + 1} / ${post.slides.length}`;
  document.getElementById('ps').disabled = sIdx === 0;
  document.getElementById('ns').disabled = sIdx === post.slides.length - 1;
  document.getElementById('pp').disabled = pIdx === 0;
  document.getElementById('np').disabled = pIdx === posts.length - 1;
}
function changeSlide(d) { sIdx = Math.max(0, Math.min(posts[pIdx].slides.length - 1, sIdx + d)); updateSlide(); }
function gotoSlide(i) { sIdx = i; updateSlide(); }
function changePost(d) { pIdx = Math.max(0, Math.min(posts.length - 1, pIdx + d)); renderPost(); }
function jumpPost(i) { pIdx = i; renderPost(); }

renderPost();
</script>
</body>
</html>
