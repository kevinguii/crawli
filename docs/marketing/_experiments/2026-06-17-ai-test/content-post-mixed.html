<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli — Mixed Imagery Test (AI + clipart + symbol)</title>
<!-- DIVERSITY TEST: one post that mixes all three imagery types.
     cover = AI raster · step01 = original symbol · step02 = AI raster ·
     step03 = vector clipart · step04 = vector clipart · + type-only slides.
     AI images generated with gpt-image-2 (medium, ~$0.05 each) into ai-images/. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;0,900;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{ --c:#a16207; --bg:linear-gradient(150deg,#a16207 0%,#713f12 100%); --ink:#fefce8; --ink-dim:rgba(254,252,232,.62); --line:rgba(254,252,232,.22); --gold:#fde68a;
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; }
body{ font-family:var(--sans); background:#0d0d0d; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; gap:10px; }
.nbtn{ padding:9px 14px; border:1px solid #2a2a2a; border-radius:8px; background:#1a1a1a; color:#aaa; font-size:13px; cursor:pointer; font-family:var(--sans); }
.nbtn:disabled{ opacity:.3; }
.caption{ width:100%; max-width:440px; font-size:11px; color:#666; letter-spacing:.04em; font-family:var(--mono); }
.tag{ width:100%; max-width:440px; font-size:11px; color:var(--gold); font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em; }
.frame{ width:100%; max-width:440px; aspect-ratio:4/5; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 24px 80px rgba(0,0,0,.7); }
.slide{ display:none; width:100%; height:100%; position:absolute; inset:0; } .slide.on{ display:block; }
.bot-bar{ width:100%; max-width:440px; display:flex; align-items:center; justify-content:space-between; }
.sctr{ font-size:12px; color:#555; font-family:var(--mono); }
.s{ width:100%; height:100%; background:var(--bg); color:var(--ink); padding:34px 30px 28px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
.kicker{ font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
.ccard{ border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.28); display:block; }
.aimg{ object-fit:cover; }
.step .scene-wrap .ccard,.step .scene-wrap .aimg{ width:262px; height:262px; max-width:90%; }
.step .scene-wrap .vcrd{ width:212px; height:212px; }
.cover .scene .ccard,.cover .scene .aimg{ width:176px; height:176px; }
.vcrd{ background:rgba(255,255,255,.94); border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.28); }
.cover .top{ display:flex; justify-content:space-between; align-items:flex-start; }
.cover .badge{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; border:1px solid var(--line); border-radius:100px; padding:5px 12px; }
.cover .num{ font-family:var(--serif); font-size:74px; font-weight:900; line-height:.8; opacity:.16; letter-spacing:-3px; }
.cover h1{ font-family:var(--serif); font-weight:800; font-size:41px; line-height:1.0; letter-spacing:-1.5px; margin-top:20px; } .cover h1 em{ font-style:italic; font-weight:600; }
.cover .sub{ font-size:13.5px; line-height:1.5; color:var(--ink-dim); margin-top:12px; max-width:250px; }
.cover .scene{ flex:1; min-height:0; display:flex; align-items:flex-end; justify-content:flex-end; padding-top:8px; }
.cover .swipe{ font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); margin-top:10px; }
.manifesto{ justify-content:center; align-items:flex-start; } .manifesto .big{ font-family:var(--serif); font-weight:800; font-size:40px; line-height:1.08; letter-spacing:-1px; } .manifesto .big .hl{ color:var(--gold); font-style:italic; } .manifesto .foot{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin-top:22px; border-top:1px solid var(--line); padding-top:16px; max-width:320px; }
.step .scene-wrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 0 14px; }
.step .label-row{ display:flex; align-items:baseline; gap:12px; } .step .step-no{ font-family:var(--serif); font-weight:900; font-size:30px; line-height:1; } .step .step-of{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); }
.step h2{ font-family:var(--serif); font-weight:700; font-size:28px; line-height:1.12; letter-spacing:-.5px; margin-top:12px; } .step p{ font-size:13.5px; line-height:1.62; color:var(--ink-dim); margin-top:10px; max-width:330px; } .step .rule{ height:1px; background:var(--line); margin-top:12px; }
.quote{ justify-content:center; align-items:flex-start; } .quote .mark{ font-family:var(--serif); font-size:120px; line-height:.5; opacity:.18; } .quote blockquote{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:32px; line-height:1.22; letter-spacing:-.5px; margin-top:8px; } .quote .by{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); margin-top:22px; }
.cta{ justify-content:space-between; align-items:center; text-align:center; } .cta h2{ font-family:var(--serif); font-weight:800; font-size:30px; line-height:1.18; letter-spacing:-.5px; flex:1; display:flex; align-items:center; } .cta .desc{ font-size:13.5px; line-height:1.6; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:14px; text-align:left; } .cta .desc strong{ color:var(--ink); } .cta .url{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink-dim); margin-top:8px; }
</style>
</head>
<body>
<div class="caption">Mixed imagery test · "Win at In-Person Thrifting"</div>
<div class="tag" id="tag"></div>
<div class="frame" id="frame"></div>
<div class="bot-bar"><button class="nbtn" id="ps" onclick="go(-1)">← Prev</button><span class="sctr" id="sctr"></span><button class="nbtn" id="ns" onclick="go(1)">Next →</button></div>
<script>
const C='#a16207';
const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="150" height="45"><defs><linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E24B4A"/><stop offset="25%" stop-color="#E84D1D"/><stop offset="50%" stop-color="#D85A30"/><stop offset="75%" stop-color="#EF9F27"/><stop offset="100%" stop-color="#FAC775"/></linearGradient></defs><text x="100" y="46" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="url(#cg)">Crawli</text></svg>`;

/* ── imagery type 1: AI raster (gpt-image-2) ── */
const ai = src => `<img class="ccard aimg" src="ai-images/${src}" alt="">`;

/* ── imagery type 2: ORIGINAL symbol style (white card + monochrome symbol) ── */
const symClock = `<svg class="ccard vcrd" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <circle cx="90" cy="92" r="54" fill="none" stroke="${C}" stroke-width="6" opacity=".22"/>
  <circle cx="90" cy="92" r="44" fill="${C}" opacity=".06"/>
  <line x1="90" y1="92" x2="90" y2="58" stroke="${C}" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="92" x2="114" y2="102" stroke="${C}" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="92" r="5" fill="${C}"/>
  <g stroke="${C}" stroke-width="3" stroke-linecap="round" opacity=".5"><line x1="90" y1="20" x2="90" y2="30"/><line x1="42" y1="40" x2="48" y2="48"/><line x1="138" y1="40" x2="132" y2="48"/></g>
</svg>`;

/* ── imagery type 3: vector clipart (drawn) ── */
const P = { cream:'#f7efe0', skin:'#e7ad84', hair:'#3a2a20', teal:'#2a9d8f', denim:'#46587a', denimD:'#3a496a', shoe:'#2b2b2b', g1:'#e76f51', g1D:'#c75a3f', g2:'#e9c46a', g3:'#6d9eeb', g3D:'#5683c4', metal:'#9aa0a6', floor:'#ece1cd' };
function head(cx,cy){ return `<circle cx="${cx}" cy="${cy}" r="13" fill="${P.skin}"/><path d="M${cx-13} ${cy-1} q-2-17 14-17 q17 0 13 18 q-4-8 -13-8 q-9 0 -14 7z" fill="${P.hair}"/>`; }
function cardBg(fy=160){ return `<rect width="200" height="200" rx="18" fill="${P.cream}"/><rect y="${fy}" width="200" height="${200-fy}" fill="${P.floor}"/>`; }
function tee(cx,topY,color,collar,s=1,bodyH=46){ const hw=19*s,nk=8*s,bh=12*s,shY=topY+4*s,slY=topY+12*s,ubY=topY+14*s,hemY=topY+bodyH,dip=topY+7*s;
  return `<path d="M${cx-nk} ${topY} L${cx-hw} ${shY} L${cx-hw+5*s} ${slY} L${cx-bh} ${ubY} L${cx-bh} ${hemY} L${cx+bh} ${hemY} L${cx+bh} ${ubY} L${cx+hw-5*s} ${slY} L${cx+hw} ${shY} L${cx+nk} ${topY} Q${cx} ${dip} ${cx-nk} ${topY} Z" fill="${color}"/><path d="M${cx-nk} ${topY} Q${cx} ${dip} ${cx+nk} ${topY}" fill="none" stroke="${collar}" stroke-width="${2.2*s}" stroke-linecap="round"/>`; }
function hook(cx,topY){ return `<path d="M${cx} ${topY} L${cx} ${topY-9} q0 -3 3 -3" fill="none" stroke="${P.metal}" stroke-width="2"/>`; }
const SC_feel = `<svg class="ccard" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${cardBg(162)}
  <rect x="34" y="42" width="84" height="5" rx="2.5" fill="${P.metal}"/>${hook(76,48)}${tee(76,48,P.g3,P.g3D,1.2,62)}
  <g stroke="${P.g3D}" stroke-width="1.6" opacity=".6"><line x1="64" y1="74" x2="88" y2="74"/><line x1="63" y1="86" x2="89" y2="86"/><line x1="63" y1="98" x2="89" y2="98"/><line x1="64" y1="110" x2="88" y2="110"/></g>
  <path d="M150 122 l-4 36 l9 0 l5-29 z" fill="${P.denimD}"/><path d="M161 122 l3 36 l9 0 l-2-37 z" fill="${P.denim}"/>
  <ellipse cx="151" cy="161" rx="8" ry="4" fill="${P.shoe}"/><ellipse cx="170" cy="161" rx="8" ry="4" fill="${P.shoe}"/>
  <path d="M147 94 q14-6 26 0 l3 30 q-16 6 -32 0 z" fill="${P.teal}"/>
  <path d="M172 100 l8 20 l-7 3 l-8-20 z" fill="${P.teal}"/><circle cx="177" cy="123" r="5.5" fill="${P.skin}"/>
  <path d="M150 102 Q124 104 102 106 L103 114 Q126 112 152 110 Z" fill="${P.teal}"/><circle cx="98" cy="108" r="6" fill="${P.skin}"/>
  <path d="M93 104 l-6 -2 M93 112 l-6 3" stroke="${P.skin}" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 92 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="${P.g2}"/>${head(160,82)}</svg>`;
const SC_shoot = `<svg class="ccard" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${cardBg(158)}
  ${tee(44,150,P.g1,P.g1D,0.5,22)}<rect x="72" y="155" width="22" height="20" rx="3" fill="${P.g3}"/><ellipse cx="60" cy="183" rx="13" ry="6" fill="${P.g2}"/>
  <g stroke="${P.metal}" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M30 142 l0-6 l6 0"/><path d="M96 142 l0-6 l-6 0"/><path d="M30 184 l0 5 l6 0"/><path d="M96 184 l0 5 l-6 0"/></g>
  <path d="M120 116 L40 140 M120 116 L94 140" stroke="${P.g3}" stroke-width="1.5" opacity=".45" stroke-dasharray="3 3"/>
  <ellipse cx="150" cy="170" rx="9" ry="4" fill="${P.shoe}"/><ellipse cx="172" cy="170" rx="9" ry="4" fill="${P.shoe}"/>
  <rect x="146" y="146" width="9" height="22" rx="3" fill="${P.denimD}"/><rect x="168" y="146" width="9" height="22" rx="3" fill="${P.denim}"/>
  <path d="M150 150 l-26 -8 l4 -13 l30 8 z" fill="${P.denimD}"/><path d="M172 150 l-26 -10 l4 -13 l30 10 z" fill="${P.denim}"/>
  <path d="M150 96 q16 -3 26 5 l-4 28 q-16 3 -27 -5 z" fill="${P.teal}"/><path d="M152 104 l-30 8 l3 9 l30 -7 z" fill="${P.teal}"/>
  <rect x="112" y="108" width="16" height="11" rx="2.5" fill="${P.shoe}"/><rect x="114" y="118" width="12" height="3" rx="1.5" fill="${P.g3}"/><circle cx="124" cy="112" r="5.5" fill="${P.skin}"/>${head(165,84)}</svg>`;

const slides = [
  { tag:'imagery: AI raster (gpt-image-2)', html:()=>`<div class="s cover">
    <div class="top"><div class="badge">🧥 In-Person Hunt</div><div class="num">5</div></div>
    <h1>The rack<br>rewards the<br><em>patient.</em></h1>
    <div class="sub">Five things great thrifters do in the store that everyone else walks right past.</div>
    <div class="scene">${ai('rack-test.png')}</div><div class="swipe">Swipe →</div></div>` },
  { tag:'imagery: none (type-only manifesto)', html:()=>`<div class="s manifesto">
    <div class="kicker">Before you go</div><div class="big" style="margin-top:18px;">The best pieces<br>are gone by <span class="hl">10 a.m.</span></div>
    <div class="foot">Thrifting in person is not luck, it is a routine. Timing, lighting, and a trained eye beat showing up on a whim every single time.</div></div>` },
  { tag:'imagery: ORIGINAL symbol (white card)', html:()=>`<div class="s step"><div class="scene-wrap">${symClock}</div>
    <div class="label-row"><span class="step-no">01</span><span class="step-of">Step · 01 / 04</span></div>
    <h2>Go on a weekday morning</h2><div class="rule"></div><p>Stores restock midweek and weekend crowds pick them clean. Walk in right after open and you are first hands on the new rack.</p></div>` },
  { tag:'imagery: AI raster (gpt-image-2)', html:()=>`<div class="s step"><div class="scene-wrap">${ai('inspect-test.png')}</div>
    <div class="label-row"><span class="step-no">02</span><span class="step-of">Step · 02 / 04</span></div>
    <h2>Hold it up to real light</h2><div class="rule"></div><p>Store lighting hides moth holes, stains, and thinning fabric. Carry pieces to a window before you commit, every flaw shows in daylight.</p></div>` },
  { tag:'imagery: vector clipart (drawn)', html:()=>`<div class="s step"><div class="scene-wrap">${SC_feel}</div>
    <div class="label-row"><span class="step-no">03</span><span class="step-of">Step · 03 / 04</span></div>
    <h2>Feel the fabric, not the tag</h2><div class="rule"></div><p>Weight and weave tell you more than any label. Dense, heavy cloth lasts, thin and papery will not survive ten washes.</p></div>` },
  { tag:'imagery: none (type-only pull-quote)', html:()=>`<div class="s quote"><div class="mark">&ldquo;</div>
    <blockquote>A great thrift find is just research that showed up wearing the right size.</blockquote>
    <div class="by">From the Crawli field notes</div></div>` },
  { tag:'imagery: vector clipart (drawn)', html:()=>`<div class="s step"><div class="scene-wrap">${SC_shoot}</div>
    <div class="label-row"><span class="step-no">04</span><span class="step-of">Step · 04 / 04</span></div>
    <h2>Shoot your finds in daylight</h2><div class="rule"></div><p>If you flip them, photos make the sale. Lay pieces flat by a window the same day, while the thrill still has you motivated.</p></div>` },
  { tag:'imagery: none (CTA)', html:()=>`<div class="s cta"><div class="logo">${LOGO}</div>
    <h2>The store is step one. The price check is step two.</h2>
    <div><div class="desc"><strong>Crawli:</strong> found something in store? Search it across 8 resale platforms in one shot to see if your find is a steal or a skip.</div><div class="url">thecrawli.com</div></div></div>` },
];

let i=0;
function render(){
  document.getElementById('frame').innerHTML = slides.map((s,n)=>`<div class="slide${n===i?' on':''}">${s.html()}</div>`).join('');
  document.getElementById('tag').textContent = slides[i].tag;
  document.getElementById('sctr').textContent = `${i+1} / ${slides.length}`;
  document.getElementById('ps').disabled=i===0; document.getElementById('ns').disabled=i===slides.length-1;
}
function go(d){ const n=i+d; if(n>=0&&n<slides.length){ i=n; render(); } }
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
render();
</script>
</body>
</html>
