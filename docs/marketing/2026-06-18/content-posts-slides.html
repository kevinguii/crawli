<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli Content Posts — 2026-06-18</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
  gap: 14px;
}

/* ── top bar ── */
.top-bar {
  width: 100%;
  max-width: 440px;
  display: flex;
  align-items: center;
  gap: 10px;
}
select {
  flex: 1;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  background: #1a1a1a;
  color: #ccc;
  font-size: 13px;
  cursor: pointer;
}
.nbtn {
  padding: 9px 14px;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  background: #1a1a1a;
  color: #aaa;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.nbtn:hover:not(:disabled) { background: #252525; color: #fff; }
.nbtn:disabled { opacity: .3; cursor: default; }

/* ── post label ── */
.post-label {
  width: 100%; max-width: 440px;
  font-size: 11px; color: #444;
  text-transform: uppercase; letter-spacing: .1em;
}

/* ── slide frame ── */
.frame {
  width: 100%; max-width: 440px;
  aspect-ratio: 4 / 5;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
}
.slide {
  display: none;
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
}
.slide.on { display: block; }

/* ── bottom bar ── */
.bot-bar {
  width: 100%; max-width: 440px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.slide-ctr { font-size: 12px; color: #444; }

/* ── cover slide ── */
.cover {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 36px 30px 30px;
  gap: 0;
  overflow: hidden;
}
.cover-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 13px;
  border-radius: 100px;
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  width: fit-content;
  margin-bottom: 18px;
}
.cover-title {
  font-size: 27px; font-weight: 800; line-height: 1.22;
}
.cover-sub {
  font-size: 14px; line-height: 1.55; opacity: .7;
  margin-top: 10px;
}
.cover-visual {
  flex: 1;
  min-height: 0;
  display: flex; align-items: center; justify-content: center;
  margin-top: 20px;
  overflow: hidden;
}
.cover-visual svg {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
}
.cover-swipe {
  font-size: 11px; opacity: .35; text-align: center;
  padding-top: 12px; letter-spacing: .05em; text-transform: uppercase;
}

/* ── step layout: number-left ── */
.step-nl {
  width: 100%; height: 100%;
  padding: 28px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.step-nl .ghost-num {
  position: absolute; top: 14px; left: 20px;
  font-size: 110px; font-weight: 900; line-height: 1;
  opacity: .08; letter-spacing: -4px;
  user-select: none;
}
.step-nl .mid-visual {
  flex: 1;
  min-height: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 50px 0 12px;
  overflow: hidden;
}
.step-nl .text-block { display: flex; flex-direction: column; gap: 8px; }
.step-nl .s-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .5;
}
.step-nl .s-title {
  font-size: 26px; font-weight: 800; line-height: 1.2;
}
.step-nl .s-desc {
  font-size: 14px; line-height: 1.6; opacity: .75;
}

/* ── step layout: visual-hero (centered) ── */
.step-vh {
  width: 100%; height: 100%;
  padding: 28px 24px 28px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 16px;
  overflow: hidden;
}
.step-vh .s-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .45;
}
.step-vh .s-title {
  font-size: 24px; font-weight: 800; line-height: 1.25;
}
.step-vh .s-desc {
  font-size: 13.5px; line-height: 1.65; opacity: .72; max-width: 320px;
}

/* ── step layout: editorial (two-col) ── */
.step-ed {
  width: 100%; height: 100%;
  padding: 32px 28px 28px;
  display: flex; flex-direction: column;
  gap: 0;
  overflow: hidden;
}
.step-ed .ed-top {
  display: flex; align-items: flex-start; gap: 20px;
  margin-bottom: 20px;
}
.step-ed .ed-text { flex: 1; }
.step-ed .s-label {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; opacity: .45;
  margin-bottom: 10px;
}
.step-ed .ed-rule {
  height: 1px; background: rgba(255,255,255,.15);
  margin-bottom: 18px;
}
.step-ed .s-title {
  font-size: 25px; font-weight: 800; line-height: 1.22;
  margin-bottom: 12px;
}
.step-ed .s-desc {
  font-size: 13.5px; line-height: 1.65; opacity: .72;
}

/* ── cta slide ── */
.cta-slide {
  width: 100%; height: 100%;
  padding: 32px 28px 28px;
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
.cta-logo { margin-bottom: 12px; }
.cta-headline {
  font-size: 24px; font-weight: 800; line-height: 1.28;
  flex: 1; display: flex; align-items: center;
}
.cta-desc {
  font-size: 14px; line-height: 1.6; opacity: .8;
  border-top: 1px solid rgba(255,255,255,.18);
  padding-top: 14px; margin-top: 16px;
}
.cta-url {
  font-size: 12px; opacity: .4; margin-top: 8px; letter-spacing: .04em;
}

/* ── visual card (white bg, colored symbol) ── */
.vcrd {
  background: rgba(255,255,255,0.93);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.vcrd-sm { width: 90px; height: 90px; border-radius: 12px; }
.vcrd-md { width: 140px; height: 140px; }
.vcrd-lg { width: 180px; height: 180px; border-radius: 20px; }
</style>
</head>

function renderCover(s, post) {
  return `<div class="cover" style="background:${post.bg}; color:${post.text};">
    <div>
      <div class="cover-badge" style="background:rgba(255,255,255,0.14);">${s.badge}</div>
      <div class="cover-title">${s.title}</div>
      <div class="cover-sub">${s.sub}</div>
    </div>
    <div class="cover-visual">${s.visualFn(post.color)}</div>
    <div class="cover-swipe">Swipe for steps →</div>
  </div>`;
}

function renderNumberLeft(s, post) {
  const c = post.color;
  return `<div class="step-nl" style="background:${post.bg}; color:${post.text};">
    <div class="ghost-num">${s.num}</div>
    <div class="mid-visual">${vcrd(s.svgFn, c, 'md')}</div>
    <div class="text-block">
      <div class="s-label">${s.label}</div>
      <div class="s-title">${s.title}</div>
      <div class="s-desc">${s.desc}</div>
    </div>
  </div>`;
}

function renderVisualHero(s, post) {
  const c = post.color;
  return `<div class="step-vh" style="background:${post.bg}; color:${post.text};">
    <div class="s-label">${s.label}</div>
    ${vcrd(s.svgFn, c, 'lg')}
    <div class="s-title">${s.title}</div>
    <div class="s-desc">${s.desc}</div>
  </div>`;
}

function renderEditorial(s, post) {
  const c = post.color;
  return `<div class="step-ed" style="background:${post.bg}; color:${post.text};">
    <div class="ed-top">
      <div class="ed-text">
        <div class="s-label">${s.label}</div>
      </div>
      ${vcrd(s.svgFn, c, 'sm')}
    </div>
    <div class="ed-rule"></div>
    <div class="s-title">${s.title}</div>
    <div class="s-desc">${s.desc}</div>
  </div>`;
}

function buildSlideHTML(s, post) {
  if (s.type === 'cover') return renderCover(s, post);
  if (s.type === 'cta')   return ctaHTML(s, post);
  const layout = post.stepLayout;
  if (layout === 'number-left')  return renderNumberLeft(s, post);
  if (layout === 'visual-hero')  return renderVisualHero(s, post);
  if (layout === 'editorial')    return renderEditorial(s, post);
  return renderVisualHero(s, post);
}

// ─── STATE + NAV ─────────────────────────────────────────────────────────────
let pi = 0, si = 0;

function render() {
  const post = posts[pi];
  const frame = document.getElementById('frame');
  frame.innerHTML = post.slides.map((s,i) =>
    `<div class="slide${i===si?' on':''}">${buildSlideHTML(s, post)}</div>`
  ).join('');
  document.getElementById('plabel').textContent = post.label;
  document.getElementById('sctr').textContent = `${si+1} / ${post.slides.length}`;
  document.getElementById('pp').disabled = pi === 0;
  document.getElementById('np').disabled = pi === posts.length-1;
  document.getElementById('ps').disabled = si === 0;
  document.getElementById('ns').disabled = si === post.slides.length-1;
  document.getElementById('sel').value = pi;
}

function changeSlide(d) {
  const n = si+d;
  if (n>=0 && n<posts[pi].slides.length) { si=n; render(); }
}
function changePost(d) {
  const n = pi+d;
  if (n>=0 && n<posts.length) { pi=n; si=0; render(); }
}
function jumpPost(v) { pi=+v; si=0; render(); }
function gotoSlide(v) { si=+v; render(); }

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') changeSlide(1);
  if(e.key==='ArrowLeft')  changeSlide(-1);
  if(e.key==='ArrowDown')  changePost(1);
  if(e.key==='ArrowUp')    changePost(-1);
});

render();
</script>
</body>
</html>
