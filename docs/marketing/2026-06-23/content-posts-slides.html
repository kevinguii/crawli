<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli Content Posts — 2026-06-23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;500;600;700&family=Cormorant:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
  gap: 14px;
}

/* ── top bar ── */
.top-bar {
  width: 100%;
  max-width: 440px;
  display: flex;
  align-items: center;
  gap: 10px;
}
select {
  flex: 1;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  background: #1a1a1a;
  color: #ccc;
  font-size: 13px;
  cursor: pointer;
}
.nbtn {
  padding: 9px 14px;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  background: #1a1a1a;
  color: #aaa;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.nbtn:hover:not(:disabled) { background: #252525; color: #fff; }
.nbtn:disabled { opacity: .3; cursor: default; }

/* ── post label ── */
.post-label {
  width: 100%; max-width: 440px;
  font-size: 11px; color: #444;
  text-transform: uppercase; letter-spacing: .1em;
}

/* ── slide frame ── */
/* 4:5 is the current default in export-slides.js (reverted 2026-06-22 from
   the brief 9:16 experiment) — kept as-is per this batch's instructions. */
.frame {
  width: 100%; max-width: 440px;
  aspect-ratio: 4 / 5;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
}
.slide {
  display: none;
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
}
.slide.on { display: block; }

/* ── bottom bar ── */
.bot-bar {
  width: 100%; max-width: 440px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.slide-ctr { font-size: 12px; color: #444; }

/* ── cover-photo slide (gpt-image-2 full-bleed cover) ── */
.cover-photo { width:100%; height:100%; position:relative; overflow:hidden; }
.cover-photo .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover-photo .scrim { position:absolute; inset:0; }
/* side-rail text placement (new this batch): text lives in a vertical column
   anchored to one side of the frame, not top or bottom or centered. The scrim
   is a horizontal gradient instead of vertical so the rail side stays legible. */
.cover-photo.rail-left .scrim { background:linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.55) 38%, rgba(0,0,0,.05) 62%, rgba(0,0,0,0) 100%); }
.cover-photo.rail-right .scrim { background:linear-gradient(270deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.55) 38%, rgba(0,0,0,.05) 62%, rgba(0,0,0,0) 100%); }
.cover-photo .content { position:relative; z-index:1; height:100%; width:58%;
  display:flex; flex-direction:column; justify-content:center;
  padding: 9% 6% 9% 7%; color:#fff; gap: 14px; }
.cover-photo.rail-right .content { margin-left:auto; align-items:flex-end; text-align:right; padding: 9% 7% 9% 6%; }
.cover-photo .badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 13px; border-radius:100px;
  font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  width:fit-content;
}
.cover-photo .hook {
  font-size:30px; line-height:1.14; font-weight:800; margin:2px 0 0;
  text-shadow: 0 2px 20px rgba(0,0,0,.5);
}
.cover-photo .swipe {
  font-size:11px; opacity:.8; letter-spacing:.05em; text-transform:uppercase; margin-top:4px;
}

/* Brutalism cover touches: blocky sharp badge, hard shadow, no blur */
.brutal .cover-photo .badge { background:var(--accent); color:#0a0a0a; border-radius:0; box-shadow:5px 5px 0 rgba(0,0,0,.9); font-weight:800; }
.brutal .cover-photo .hook { font-family:'Anton',sans-serif; letter-spacing:.2px; }

/* Glassmorphism cover touches: frosted blurred badge chip */
.glass .cover-photo .badge { background:rgba(255,255,255,.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.35); color:#fff; }
.glass .cover-photo .hook { font-family:'Cormorant',serif; font-weight:700; }

/* ── SPLIT layout (image one half / text other half, alternating L/R) ── */
.split-slide {
  width:100%; height:100%; display:flex; overflow:hidden;
}
.split-slide.img-left { flex-direction:row; }
.split-slide.img-right { flex-direction:row-reverse; }
.split-slide .split-visual {
  width:42%; height:100%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
.split-slide .split-visual .ccard,
.split-slide .split-visual .vcrd { width: 100%; height: 100%; max-width:none; border-radius:0; }
.split-slide .split-text {
  flex:1; min-width:0; height:100%;
  display:flex; flex-direction:column; justify-content:center;
  padding: 8% 7%; gap:10px;
}
.split-slide .sp-label { font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.6; }
.split-slide .sp-title { font-size:23px; font-weight:800; line-height:1.22; }
.split-slide .sp-desc { font-size:13px; line-height:1.6; opacity:.78; }

/* Brutalism split touches: hard divider, blocky border, offset shadow card */
.brutal .split-slide .split-visual { border-right:4px solid var(--ink, #0a0a0a); }
.brutal .split-slide.img-right .split-visual { border-right:none; border-left:4px solid var(--ink, #0a0a0a); }
.brutal .split-slide .sp-title { font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.2px; }
.brutal .split-slide .sp-label { font-family:'Epilogue',sans-serif; }
.brutal .split-slide .sp-desc { font-family:'Epilogue',sans-serif; }

/* Glassmorphism split touches: frosted text panel overlapping the visual edge */
.glass .split-slide .split-text { position:relative; }
.glass .split-slide .split-text::before {
  content:''; position:absolute; inset:0; backdrop-filter: blur(0px);
}
.glass .split-slide .sp-label { font-family:'Montserrat',sans-serif; }
.glass .split-slide .sp-title { font-family:'Cormorant',serif; font-weight:700; }
.glass .split-slide .sp-desc { font-family:'Montserrat',sans-serif; font-weight:300; }

/* ── GRID layout (2x2 panel grid for fact/checklist slides) ── */
.grid-slide {
  width:100%; height:100%; padding:7% 6%;
  display:flex; flex-direction:column; gap:10px; overflow:hidden;
}
.grid-slide .grid-head { display:flex; flex-direction:column; gap:4px; margin-bottom:2px; }
.grid-slide .gd-label { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.6; }
.grid-slide .gd-title { font-size:19px; font-weight:800; line-height:1.2; }
.grid-2x2 { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:9px; }
.grid-panel {
  border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:5px;
  overflow:hidden; position:relative;
}
.grid-panel .gp-num { font-size:11px; font-weight:800; opacity:.55; }
.grid-panel .gp-text { font-size:11.5px; line-height:1.36; font-weight:600; }

/* Brutalism grid: thick borders, hard offset shadows, no rounding */
.brutal .grid-panel { border-radius:0; border:3px solid var(--ink,#0a0a0a); box-shadow:4px 4px 0 rgba(0,0,0,.55); }
.brutal .grid-slide .gd-title { font-family:'Anton',sans-serif; font-weight:400; }
.brutal .grid-slide .gd-label, .brutal .grid-panel .gp-text, .brutal .grid-panel .gp-num { font-family:'Epilogue',sans-serif; }

/* Glassmorphism grid: frosted translucent panels */
.glass .grid-panel { background:rgba(255,255,255,.10); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,.22); }
.glass .grid-slide .gd-title { font-family:'Cormorant',serif; font-weight:700; }
.glass .grid-slide .gd-label, .glass .grid-panel .gp-text, .glass .grid-panel .gp-num { font-family:'Montserrat',sans-serif; }

/* ── cta slide ── */
.cta-slide {
  width: 100%; height: 100%;
  padding: 32px 28px 28px;
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
.cta-logo { margin-bottom: 12px; }
.cta-headline {
  font-size: 24px; font-weight: 800; line-height: 1.28;
  flex: 1; display: flex; align-items: center;
}
.cta-desc {
  font-size: 14px; line-height: 1.6; opacity: .8;
  padding-top: 14px; margin-top: 16px;
}
.cta-url {
  font-size: 12px; opacity: .5; margin-top: 8px; letter-spacing: .04em;
}
.brutal .cta-slide .cta-headline { font-family:'Anton',sans-serif; font-weight:400; }
.brutal .cta-slide .cta-desc, .brutal .cta-slide .cta-url { font-family:'Epilogue',sans-serif; }
.brutal .cta-slide { border-top:6px solid var(--accent); }
.brutal .cta-slide .cta-desc { border-top:3px solid rgba(255,255,255,.25); }
.glass .cta-slide .cta-headline { font-family:'Cormorant',serif; font-weight:700; }
.glass .cta-slide .cta-desc, .glass .cta-slide .cta-url { font-family:'Montserrat',sans-serif; }
.glass .cta-slide .cta-desc {
  background:rgba(255,255,255,.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:16px;
}

/* ── visual card (white bg, colored symbol) ── */
.vcrd {
  background: rgba(255,255,255,0.93);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* ── colored clipart card ── */
.ccard { display: block; }

/* ── manifesto slide (oversized statement, side-rail aligned) ── */
.manifesto {
  width: 100%; height: 100%;
  padding: 9% 8%;
  display: flex; flex-direction: column; justify-content: center; gap: 16px;
}
.manifesto .big {
  font-weight: 800; font-size: 32px; line-height: 1.16; letter-spacing: -.5px;
}
.manifesto .big .hl { font-style: italic; }
.manifesto .footnote { font-size: 12px; opacity: .55; letter-spacing: .02em; }
.brutal .manifesto .big { font-family:'Anton',sans-serif; font-weight:400; }
.brutal .manifesto .footnote { font-family:'Epilogue',sans-serif; text-transform:uppercase; letter-spacing:.1em; }
.brutal .manifesto { border-left:8px solid var(--accent); }
.glass .manifesto .big { font-family:'Cormorant',serif; font-weight:600; font-style:italic; }
.glass .manifesto .footnote { font-family:'Montserrat',sans-serif; }
.glass .manifesto .big .hl { font-weight:700; }

/* ── pull-quote slide ── */
.quote {
  width: 100%; height: 100%;
  padding: 9% 8%;
  display: flex; flex-direction: column; justify-content: center;
}
.quote .mark {
  font-size: 80px; line-height: .5; opacity: .25; margin-bottom: 10px;
}
.quote blockquote {
  font-style: italic; font-weight: 600; font-size: 24px; line-height: 1.3; letter-spacing: -.3px;
}
.quote .attribution {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-top: 18px;
}
.glass .quote blockquote { font-family:'Cormorant',serif; }
.glass .quote .attribution { font-family:'Montserrat',sans-serif; }

/* ── Brutalism global accent: high contrast block badge reused on body slides ── */
.brutal .sp-label, .brutal .gd-label { background:var(--accent); color:#0a0a0a; display:inline-block; padding:3px 8px; width:fit-content; }
</style>
</head>

function head(cx,cy){ return `<circle cx="${cx}" cy="${cy}" r="13" fill="${P.skin}"/>
  <path d="M${cx-13} ${cy-1} q-2-17 14-17 q17 0 13 18 q-4-8 -13-8 q-9 0 -14 7z" fill="${P.hair}"/>`; }

function cardBg(floorY=160){ return `<rect width="200" height="200" fill="${P.cream}"/><rect y="${floorY}" width="200" height="${200-floorY}" fill="${P.floor}"/>`; }

function tee(cx, topY, color, collar, s=1, bodyH=46){
  const hw=19*s, nk=8*s, bh=12*s, shY=topY+4*s, slY=topY+12*s, ubY=topY+14*s, hemY=topY+bodyH, dip=topY+7*s;
  return `<path d="M${cx-nk} ${topY} L${cx-hw} ${shY} L${cx-hw+5*s} ${slY} L${cx-bh} ${ubY} L${cx-bh} ${hemY} L${cx+bh} ${hemY} L${cx+bh} ${ubY} L${cx+hw-5*s} ${slY} L${cx+hw} ${shY} L${cx+nk} ${topY} Q${cx} ${dip} ${cx-nk} ${topY} Z" fill="${color}"/>`
    + `<path d="M${cx-nk} ${topY} Q${cx} ${dip} ${cx+nk} ${topY}" fill="none" stroke="${collar}" stroke-width="${2.2*s}" stroke-linecap="round"/>`;
}
function hook(cx, topY){ return `<path d="M${cx} ${topY} L${cx} ${topY-9} q0 -3 3 -3" fill="none" stroke="${P.metal}" stroke-width="2"/>`; }

    <circle cx="${hx}" cy="${hy}" r="6" fill="${P.skin}"/>${head(160,80)}`;
}

// helper: wrap SVG in a visual card div
function vcrd(svgFn, color) {
  return `<div class="vcrd">${svgFn(color)}</div>`;
}
function visual(s, c) {
  if (s.sceneKey && SC[s.sceneKey]) return SC[s.sceneKey];
  return vcrd(s.svgFn, c);
}

// ─── CTA slide HTML ───────────────────────────────────────────────────────────
function ctaHTML(s, post) {
  return `<div class="cta-slide" style="background:${post.bg}; color:${post.text}; align-items:center; text-align:center; --accent:${post.color};">
    <div style="display:flex;justify-content:center;">${LOGO}</div>
    <div class="cta-headline" style="text-align:center;">${s.headline}</div>
    <div>
      <div class="cta-desc" style="text-align:left;"><strong>Crawli:</strong> ${s.crawli}</div>
      <div class="cta-url">thecrawli.com</div>
    </div>
  </div>`;
}

function railClass(post) { return post.rail === 'right' ? 'rail-right' : 'rail-left'; }

function renderCoverPhoto(s, post) {
  return `<div class="cover-photo ${railClass(post)}" style="--accent:${post.color};">
    <img class="bg" src="${s.img}" alt="">
    <div class="scrim"></div>
    <div class="content">
      <span class="badge" style="background:rgba(255,255,255,.2);">${s.badge}</span>
      <h1 class="hook">${s.title}</h1>
      <span class="swipe">${s.swipe || 'Swipe →'}</span>
    </div>
  </div>`;
}

function renderSplit(s, post) {
  const c = post.color;
  const side = post.rail === 'right' ? 'img-left' : 'img-right'; // visual sits opposite the text rail
  return `<div class="split-slide ${side}" style="background:${post.bg}; color:${post.text}; --accent:${c}; --ink:${post.text};">
    <div class="split-visual">${visual(s, c)}</div>
    <div class="split-text">
      <div class="sp-label">${s.label}</div>
      <div class="sp-title">${s.title}</div>
      <div class="sp-desc">${s.desc}</div>
    </div>
  </div>`;
}

function renderGrid(s, post) {
  const c = post.color;
  return `<div class="grid-slide" style="background:${post.bg}; color:${post.text}; --accent:${c}; --ink:${post.text};">
    <div class="grid-head">
      <div class="gd-label">${s.label}</div>
      <div class="gd-title">${s.title}</div>
    </div>
    <div class="grid-2x2">
      ${s.panels.map((p,i) => `<div class="grid-panel"><div class="gp-num">${String(i+1).padStart(2,'0')}</div><div class="gp-text">${p}</div></div>`).join('')}
    </div>
  </div>`;
}

function renderManifesto(s, post) {
  return `<div class="manifesto" style="background:${post.bg}; color:${post.text}; --accent:${post.color};">
    <div class="big">${s.text}</div>
    ${s.footnote ? `<div class="footnote">${s.footnote}</div>` : ''}
  </div>`;
}

function renderQuote(s, post) {
  return `<div class="quote" style="background:${post.bg}; color:${post.text};">
    <div class="mark">&ldquo;</div>
    <blockquote>${s.quote}</blockquote>
    ${s.attribution ? `<div class="attribution">${s.attribution}</div>` : ''}
  </div>`;
}

function buildSlideHTML(s, post) {
  if (s.type === 'cover-photo') return renderCoverPhoto(s, post);
  if (s.type === 'cta')         return ctaHTML(s, post);
  if (s.type === 'manifesto')   return renderManifesto(s, post);
  if (s.type === 'pull-quote')  return renderQuote(s, post);
  if (s.type === 'grid-panel')  return renderGrid(s, post);
  return renderSplit(s, post);
}

// ─── STATE + NAV ─────────────────────────────────────────────────────────────
let pi = 0, si = 0;

function render() {
  const post = posts[pi];
  const frame = document.getElementById('frame');
  frame.className = `frame ${post.styleClass}`;
  frame.innerHTML = post.slides.map((s,i) =>
    `<div class="slide${i===si?' on':''}">${buildSlideHTML(s, post)}</div>`
  ).join('');
  document.getElementById('plabel').textContent = post.label;
  document.getElementById('sctr').textContent = `${si+1} / ${post.slides.length}`;
  document.getElementById('pp').disabled = pi === 0;
  document.getElementById('np').disabled = pi === posts.length-1;
  document.getElementById('ps').disabled = si === 0;
  document.getElementById('ns').disabled = si === post.slides.length-1;
  document.getElementById('sel').value = pi;
}

function changeSlide(d) {
  const n = si+d;
  if (n>=0 && n<posts[pi].slides.length) { si=n; render(); }
}
function changePost(d) {
  const n = pi+d;
  if (n>=0 && n<posts.length) { pi=n; si=0; render(); }
}
function jumpPost(v) { pi=+v; si=0; render(); }
function gotoSlide(v) { si=+v; render(); }

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') changeSlide(1);
  if(e.key==='ArrowLeft')  changeSlide(-1);
  if(e.key==='ArrowDown')  changePost(1);
  if(e.key==='ArrowUp')    changePost(-1);
});

render();
</script>
