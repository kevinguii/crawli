<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0a0a0a;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px; gap: 14px;
}

/* ── top bar ── */
.top-bar { width:100%; max-width:440px; display:flex; align-items:center; gap:10px; }
select { flex:1; padding:9px 12px; border-radius:8px; border:1px solid #2a2a2a; background:#1a1a1a; color:#ccc; font-size:13px; cursor:pointer; }
.nbtn { padding:9px 14px; border:1px solid #2a2a2a; border-radius:8px; background:#1a1a1a; color:#aaa; font-size:13px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.nbtn:hover:not(:disabled) { background:#252525; color:#fff; }
.nbtn:disabled { opacity:.3; cursor:default; }
.post-label { width:100%; max-width:440px; font-size:11px; color:#444; text-transform:uppercase; letter-spacing:.1em; }

/* ── slide frame (4:5) ── */
.frame { width:100%; max-width:440px; aspect-ratio:4/5; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 24px 80px rgba(0,0,0,.7); }
.slide { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
.slide.on { display:block; }
.bot-bar { width:100%; max-width:440px; display:flex; align-items:center; justify-content:space-between; }
.slide-ctr { font-size:12px; color:#444; }

/* ════════════════════════════════════════════════════════════════════
   COVER PHOTO — placements: top-anchor / side-rail / centered-stacked / bottom-anchor
   ════════════════════════════════════════════════════════════════════ */
.cover-photo { width:100%; height:100%; position:relative; overflow:hidden; }
.cover-photo .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover-photo .scrim { position:absolute; inset:0; }
.cover-photo.place-top .scrim { background:linear-gradient(0deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.42) 58%, rgba(0,0,0,.82) 100%); }
.cover-photo.place-bottom .scrim { background:linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.42) 58%, rgba(0,0,0,.82) 100%); }
.cover-photo.place-center .scrim { background:radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,.64) 0%, rgba(0,0,0,.42) 55%, rgba(0,0,0,.30) 100%); }
.cover-photo.place-rail .scrim { background:linear-gradient(90deg, rgba(0,0,0,.84) 0%, rgba(0,0,0,.56) 38%, rgba(0,0,0,.06) 62%, rgba(0,0,0,0) 100%); }
.cover-photo .content { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; color:#fff; gap:14px; padding:9% 16% 12% 7%; }
.cover-photo.place-top .content { justify-content:flex-start; }
.cover-photo.place-bottom .content { justify-content:flex-end; }
.cover-photo.place-center .content { justify-content:center; align-items:center; text-align:center; padding:9% 12% 12% 12%; }
.cover-photo.place-rail .content { width:60%; justify-content:center; padding:9% 6% 9% 7%; }
.cover-photo .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:100px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.30); font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; width:fit-content; }
.cover-photo .hook { font-size:29px; line-height:1.15; font-weight:800; margin:2px 0 0; text-shadow:0 2px 22px rgba(0,0,0,.55); }
.cover-photo .swipe { font-size:11px; opacity:.82; letter-spacing:.06em; text-transform:uppercase; margin-top:4px; }

/* ════════════════════════════════════════════════════════════════════

const T = { card:'#f7efe0', ink:'#2f2a25', gold:'#c9a15a', wood:'#a9855c', woodD:'#7c5c3a',
  cream2:'#efe6d2', shadow:'rgba(47,42,37,.16)', white:'#ffffff' };

// ─── RENDER FUNCTIONS ────────────────────────────────────────────────────────
function styleVars(post){ return `--accent:${post.color}; --neubg:${post.neubg||''};`; }
function visual(s, c){ return CL[s.illo] ? `<div class="ccard">${CL[s.illo](c)}</div>` : ''; }

function renderCoverPhoto(s, post) {
  const place = `place-${s.place || 'bottom'}`;
  return `<div class="cover-photo ${place}" style="${styleVars(post)}">
    <img class="bg" src="${s.img}" alt="">
    <div class="scrim"></div>
    <div class="content">
      <span class="badge">${s.badge}</span>
      <h1 class="hook">${s.title}</h1>
      <span class="swipe">${s.swipe || 'Swipe →'}</span>
    </div>
  </div>`;
}

function renderSplit(s, post) {
  const side = s.side === 'right' ? 'img-right' : 'img-left';
  return `<div class="split-slide ${side}" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="split-visual">${visual(s, post.color)}</div>
    <div class="split-text">
      ${s.label ? `<div class="sp-label">${s.label}</div>` : ''}
      <div class="sp-title">${s.title}</div>
      <div class="sp-desc">${s.desc}</div>
    </div>
  </div>`;
}

function renderNumberLeft(s, post) {
  return `<div class="step-nl" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="ghost-num">${s.num}</div>
    <div class="mid-visual">${visual(s, post.color)}</div>
    <div class="text-block">
      <div class="s-label">${s.label}</div>
      <div class="s-title">${s.title}</div>
      <div class="s-desc">${s.desc}</div>
    </div>
  </div>`;
}

function renderVisualHero(s, post) {
  return `<div class="step-vh" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    ${visual(s, post.color)}
    <div class="s-label">${s.label}</div>
    <div class="s-title">${s.title}</div>
    <div class="s-desc">${s.desc}</div>
  </div>`;
}

function renderGrid(s, post) {
  return `<div class="grid-slide" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="grid-head">
      ${s.section ? `<div class="gd-label">${s.section}</div>` : ''}
      <div class="gd-title">${s.title}</div>
    </div>
    <div class="grid-2x2">
      ${s.panels.map((p,i) => `<div class="grid-panel"><div class="gp-num">${String(i+1).padStart(2,'0')}</div><div class="gp-text">${p}</div></div>`).join('')}
    </div>
  </div>`;
}

function renderMyth(s, post) {
  return `<div class="step-myth" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="ghost-myth-num">${s.num}</div>
    <div class="myth-label">Myth</div>
    <div class="myth-text">${s.myth}</div>
    <div class="truth-label">Actually</div>
    <div class="truth-text">${s.truth}</div>
  </div>`;
}

function renderManifesto(s, post) {
  return `<div class="manifesto" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="big">${s.text}</div>
    ${s.footnote ? `<div class="footnote">${s.footnote}</div>` : ''}
  </div>`;
}
function renderQuote(s, post) {
  return `<div class="quote" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="mark">&ldquo;</div>
    <blockquote>${s.quote}</blockquote>
    ${s.attribution ? `<div class="attribution">${s.attribution}</div>` : ''}
  </div>`;
}
function renderStat(s, post) {
  return `<div class="stat" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="num">${s.num}</div>
    <div class="ctx">${s.ctx}</div>
  </div>`;
}
function renderCta(s, post) {
  return `<div class="cta-slide" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="cta-tag">${s.tag || 'RESELLER INTEL'}</div>
    <div class="cta-headline">${s.headline}</div>
    ${s.closing ? `<div class="cta-closing">${s.closing}</div>` : ''}
  </div>`;
}

function buildSlideHTML(s, post) {
  if (s.type === 'cover-photo') return renderCoverPhoto(s, post);
  if (s.type === 'cta') return renderCta(s, post);
  if (s.type === 'manifesto') return renderManifesto(s, post);
  if (s.type === 'pull-quote') return renderQuote(s, post);
  if (s.type === 'stat') return renderStat(s, post);
  if (s.type === 'myth') return renderMyth(s, post);
  if (s.type === 'grid') return renderGrid(s, post);
  if (s.type === 'split') return renderSplit(s, post);
  if (post.layout === 'number-left') return renderNumberLeft(s, post);
  return renderVisualHero(s, post);
}

// ─── NAV / RENDER ───────────────────────────────────────────────────────────
let pIdx = 0, sIdx = 0;
const frame = document.getElementById('frame');
const sel = document.getElementById('sel');
const plabel = document.getElementById('plabel');

function renderPost() {
  const post = posts[pIdx];
  frame.innerHTML = post.slides.map(s => `<div class="slide ${post.fontClass} ${post.styleClass}">${buildSlideHTML(s, post)}</div>`).join('');
  sIdx = 0;
  plabel.textContent = post.label;
  sel.value = pIdx;
  updateSlide();
}
function updateSlide() {
  const post = posts[pIdx];
  const slideEls = frame.querySelectorAll('.slide');
  slideEls.forEach((el, i) => el.classList.toggle('on', i === sIdx));
  document.getElementById('sctr').textContent = `${sIdx + 1} / ${post.slides.length}`;
  document.getElementById('ps').disabled = sIdx === 0;
  document.getElementById('ns').disabled = sIdx === post.slides.length - 1;
  document.getElementById('pp').disabled = pIdx === 0;
  document.getElementById('np').disabled = pIdx === posts.length - 1;
}
function changeSlide(d) {
  const post = posts[pIdx];
  const next = sIdx + d;
  if (next < 0 || next >= post.slides.length) return;
  sIdx = next;
  updateSlide();
}
function gotoSlide(i) { sIdx = i; updateSlide(); }
function changePost(d) {
  const next = pIdx + d;
  if (next < 0 || next >= posts.length) return;
  pIdx = next;
  renderPost();
}
function jumpPost(i) { pIdx = i; renderPost(); }

renderPost();
</script>
