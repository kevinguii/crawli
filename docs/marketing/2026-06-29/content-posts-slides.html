<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli Content Posts — 2026-06-29</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 3 fresh pairings, none in the previous 1-2 batches:
     Space Grotesk+DM Sans (font-grotesk), Calistoga+Inter (font-cali),
     Archivo Black+Spectral (font-archivo).
     Cover text placement: corner-block (solid accent panel anchored bottom-left) — new.
     Inner layouts: ledger, checklist, editorial-step — all new. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Calistoga&family=Inter:wght@300;400;500;600;700&family=Archivo+Black&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0a0a0a;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px; gap: 14px;
}

/* ── top bar ── */
.top-bar { width:100%; max-width:440px; display:flex; align-items:center; gap:10px; }
select { flex:1; padding:9px 12px; border-radius:8px; border:1px solid #2a2a2a; background:#1a1a1a; color:#ccc; font-size:13px; cursor:pointer; }
.nbtn { padding:9px 14px; border:1px solid #2a2a2a; border-radius:8px; background:#1a1a1a; color:#aaa; font-size:13px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.nbtn:hover:not(:disabled) { background:#252525; color:#fff; }
.nbtn:disabled { opacity:.3; cursor:default; }
.post-label { width:100%; max-width:440px; font-size:11px; color:#444; text-transform:uppercase; letter-spacing:.1em; }

/* ── slide frame (4:5) ── */
.frame { width:100%; max-width:440px; aspect-ratio:4/5; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 24px 80px rgba(0,0,0,.7); }
.slide { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
.slide.on { display:block; }
.bot-bar { width:100%; max-width:440px; display:flex; align-items:center; justify-content:space-between; }
.slide-ctr { font-size:12px; color:#444; }

/* ════════════════════════════════════════════════════════════════════
   COVER PHOTO
   ════════════════════════════════════════════════════════════════════ */
.cover-photo { width:100%; height:100%; position:relative; overflow:hidden; }
.cover-photo .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover-photo .scrim { position:absolute; inset:0; }

/* NEW: corner-block — solid accent panel in bottom-left, photo visible in upper-right.
   The panel IS the text surface; no text bleeds into the raw photo. */
.cover-photo.place-corner .scrim {
  background: linear-gradient(148deg, rgba(0,0,0,.02) 38%, rgba(0,0,0,.10) 62%, rgba(0,0,0,.22) 82%);
}
.cover-photo.place-corner .content {
  position:absolute; z-index:2; bottom:0; left:0; right:0; display:block; padding:0;
}
.cover-photo.place-corner .corner-box {
  background: var(--accent);
  padding: 18px 22px 22px;
  max-width: 84%;
  display: flex; flex-direction:column; gap:8px;
}
/* fallback bottom placement */
.cover-photo.place-bottom .scrim {
  background: linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.36) 55%,rgba(0,0,0,.82) 100%);
}
.cover-photo.place-bottom .content {
  position:absolute; z-index:2; bottom:0; left:0; right:0;
  padding: 8% 16% 12% 7%;
  display:flex; flex-direction:column; gap:10px;
}

/* shared cover text elements */
.cover-photo .badge {
  display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:100px;
  background:rgba(255,255,255,.20); border:1px solid rgba(255,255,255,.32);
  font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  width:fit-content; color:#fff;
}
.cover-photo .hook {
  font-size:23px; line-height:1.18; font-weight:800; color:#fff;
  text-shadow:0 1px 12px rgba(0,0,0,.35);
}
.cover-photo .swipe { font-size:10px; opacity:.80; letter-spacing:.07em; text-transform:uppercase; color:#fff; }

/* ════════════════════════════════════════════════════════════════════
   LEDGER — horizontal-striped rows, number col left, content right.
   Best for 4–6 items; each row is a discrete data point.
   ════════════════════════════════════════════════════════════════════ */
.ledger { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.ledger .l-head {
  padding:22px 22px 14px; border-bottom:1px solid rgba(255,255,255,.10); flex-shrink:0;
}
.ledger .l-section {
  font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; opacity:.36; margin-bottom:5px;
}
.ledger .l-head-title { font-size:18px; font-weight:800; line-height:1.22; }
.ledger .l-rows { flex:1; display:flex; flex-direction:column; }
.ledger .l-row {
  flex:1; display:flex; align-items:stretch;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.ledger .l-row:last-child { border-bottom:none; }
.ledger .l-num {
  width:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:900; opacity:.14; padding:0; letter-spacing:-.5px;
}
.ledger .l-row.hi .l-num { opacity:1; color:var(--accent); background:rgba(255,255,255,.05); }
.ledger .l-sep { width:1px; background:rgba(255,255,255,.08); flex-shrink:0; }
.ledger .l-content {
  flex:1; padding:12px 16px 12px 14px; display:flex; flex-direction:column; justify-content:center; gap:3px;
}
.ledger .l-label { font-size:10px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; opacity:.36; }
.ledger .l-title { font-size:13.5px; font-weight:700; line-height:1.28; }
.ledger .l-desc { font-size:11.5px; line-height:1.55; opacity:.66; }

/* ════════════════════════════════════════════════════════════════════
   CHECKLIST — numbered items stacked vertically, actionable format.
   Best for 4–5 items; each item is a step or check.
   ════════════════════════════════════════════════════════════════════ */
.checklist {
  width:100%; height:100%; display:flex; flex-direction:column;
  padding:24px 22px 20px; overflow:hidden;
}
.checklist .ck-head { margin-bottom:14px; flex-shrink:0; }
.checklist .ck-section {
  font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; opacity:.36; margin-bottom:5px;
}
.checklist .ck-head-title { font-size:18px; font-weight:800; line-height:1.22; }
.checklist .ck-items { display:flex; flex-direction:column; flex:1; justify-content:space-between; }
.checklist .ck-item {
  display:flex; align-items:flex-start; gap:13px;
  padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08);
}
.checklist .ck-item:last-child { border-bottom:none; }
.checklist .ck-num {
  font-size:10px; font-weight:800; min-width:22px; height:22px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center;
  flex-shrink:0; margin-top:1px; opacity:.52; letter-spacing:0;
}
.checklist .ck-num.tick {
  background:var(--accent); border-color:var(--accent); opacity:1; color:#fff;
}
.checklist .ck-text { display:flex; flex-direction:column; gap:2px; }
.checklist .ck-name { font-size:13.5px; font-weight:700; line-height:1.28; }
.checklist .ck-detail { font-size:11.5px; line-height:1.55; opacity:.68; }

/* ════════════════════════════════════════════════════════════════════
   EDITORIAL STEP — text-dominant, typographic, no icon dependency.
   Large ghost element for depth; content sits center stage.
   ════════════════════════════════════════════════════════════════════ */
.ed-step {
  width:100%; height:100%; display:flex; flex-direction:column;
  justify-content:space-between; padding:28px 24px 26px; overflow:hidden; position:relative;
}
.ed-step .ed-ghost {
  position:absolute; right:12px; top:14px; font-size:96px; font-weight:900;
  opacity:.05; letter-spacing:-3px; user-select:none; line-height:1; pointer-events:none;
}
.ed-step .ed-top { display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
.ed-step .ed-section {
  font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; opacity:.36;
}
.ed-step .ed-counter { font-size:11px; font-weight:600; opacity:.36; letter-spacing:.04em; }
.ed-step .ed-body {
  flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:16px 0;
}
.ed-step .ed-headline { font-size:24px; font-weight:800; line-height:1.22; }
.ed-step .ed-sub { font-size:13px; line-height:1.65; opacity:.76; }
.ed-step .ed-pill {
  display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:100px;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  margin-top:2px; width:fit-content;
}

/* ════════════════════════════════════════════════════════════════════
   MANIFESTO / STAT / PULL-QUOTE / MYTH (reused patterns)
   ════════════════════════════════════════════════════════════════════ */
.manifesto {
  width:100%; height:100%; padding:38px 26px; display:flex; flex-direction:column; justify-content:center; gap:16px;
}
.manifesto .big { font-weight:800; font-size:31px; line-height:1.16; letter-spacing:-.4px; }
.manifesto .big .hl { font-style:italic; }
.manifesto .footnote { font-size:12px; opacity:.48; letter-spacing:.02em; }

.stat {
  width:100%; height:100%; padding:38px 26px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:14px;
}
.stat .num { font-size:88px; font-weight:900; line-height:.9; letter-spacing:-2px; }
.stat .ctx { font-size:14.5px; line-height:1.58; opacity:.76; max-width:300px; }

.pull-quote { width:100%; height:100%; padding:38px 26px; display:flex; flex-direction:column; justify-content:center; }
.pull-quote .mark { font-size:76px; line-height:.5; opacity:.18; margin-bottom:14px; }
.pull-quote blockquote { font-style:italic; font-weight:600; font-size:22px; line-height:1.34; }
.pull-quote .attribution { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; opacity:.48; margin-top:18px; }

.myth-card {
  width:100%; height:100%; padding:32px 24px; display:flex; flex-direction:column;
  justify-content:center; gap:12px; position:relative; overflow:hidden;
}
.myth-card .mc-ghost {
  position:absolute; top:10px; right:14px; font-size:84px; font-weight:900;
  opacity:.06; line-height:1; user-select:none; pointer-events:none;
}
.myth-card .mc-label { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.40; }
.myth-card .mc-myth { font-size:17.5px; font-weight:700; line-height:1.36; text-decoration:line-through; opacity:.38; }
.myth-card .mc-truth-label {
  font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.60; margin-top:8px;
}
.myth-card .mc-truth { font-size:21px; font-weight:800; line-height:1.28; }

/* ════════════════════════════════════════════════════════════════════
   CTA — 2026-06-29 batch: NO URL, NO explicit CTA, subtle/varied closing.
   ════════════════════════════════════════════════════════════════════ */
.cta-slide {
  width:100%; height:100%; padding:32px 24px; display:flex; flex-direction:column;
  justify-content:space-between; overflow:hidden;
}
.cta-slide .cta-tag {
  font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; opacity:.36; flex-shrink:0;
}
.cta-slide .cta-headline { font-size:23px; font-weight:800; line-height:1.24; flex:1; display:flex; align-items:center; }
.cta-slide .cta-closing {
  font-size:13px; line-height:1.66; opacity:.76;
  border-top:1px solid rgba(255,255,255,.14); padding-top:15px; margin-top:14px;
}

/* ════════════════════════════════════════════════════════════════════
   FONT TRACKS
   ════════════════════════════════════════════════════════════════════ */
/* font-grotesk = Space Grotesk (display) + DM Sans (body) */
.font-grotesk .hook,
.font-grotesk .l-head-title,
.font-grotesk .ck-head-title,
.font-grotesk .ed-headline,
.font-grotesk .manifesto .big,
.font-grotesk .stat .num,
.font-grotesk .pull-quote blockquote,
.font-grotesk .cta-headline,
.font-grotesk .mc-myth,
.font-grotesk .mc-truth { font-family:'Space Grotesk', sans-serif; }

.font-grotesk .badge,.font-grotesk .swipe,
.font-grotesk .l-section,.font-grotesk .l-label,.font-grotesk .l-title,.font-grotesk .l-desc,
.font-grotesk .ck-section,.font-grotesk .ck-name,.font-grotesk .ck-detail,
.font-grotesk .ed-section,.font-grotesk .ed-counter,.font-grotesk .ed-sub,.font-grotesk .ed-pill,
.font-grotesk .manifesto .footnote,.font-grotesk .stat .ctx,
.font-grotesk .cta-tag,.font-grotesk .cta-closing,
.font-grotesk .mc-label,.font-grotesk .mc-truth-label,
.font-grotesk .pull-quote .attribution { font-family:'DM Sans', sans-serif; }

/* font-cali = Calistoga (display) + Inter (body) */
.font-cali .hook,
.font-cali .l-head-title,
.font-cali .ck-head-title,
.font-cali .ed-headline,
.font-cali .manifesto .big,
.font-cali .stat .num,
.font-cali .pull-quote blockquote,
.font-cali .cta-headline,
.font-cali .mc-myth,
.font-cali .mc-truth { font-family:'Calistoga', cursive; }

.font-cali .badge,.font-cali .swipe,
.font-cali .l-section,.font-cali .l-label,.font-cali .l-title,.font-cali .l-desc,
.font-cali .ck-section,.font-cali .ck-name,.font-cali .ck-detail,
.font-cali .ed-section,.font-cali .ed-counter,.font-cali .ed-sub,.font-cali .ed-pill,
.font-cali .manifesto .footnote,.font-cali .stat .ctx,
.font-cali .cta-tag,.font-cali .cta-closing,
.font-cali .mc-label,.font-cali .mc-truth-label,
.font-cali .pull-quote .attribution { font-family:'Inter', sans-serif; }

/* font-archivo = Archivo Black (heavy display) + Spectral (literary serif body) */
.font-archivo .hook,
.font-archivo .l-head-title,
.font-archivo .ck-head-title,
.font-archivo .ed-headline,
.font-archivo .manifesto .big,
.font-archivo .stat .num,
.font-archivo .pull-quote blockquote,
.font-archivo .cta-headline,
.font-archivo .mc-myth,
.font-archivo .mc-truth { font-family:'Archivo Black', sans-serif; }

.font-archivo .badge,.font-archivo .swipe,
.font-archivo .l-section,.font-archivo .l-label,.font-archivo .l-title,.font-archivo .l-desc,
.font-archivo .ck-section,.font-archivo .ck-name,.font-archivo .ck-detail,
.font-archivo .ed-section,.font-archivo .ed-counter,.font-archivo .ed-sub,.font-archivo .ed-pill,
.font-archivo .manifesto .footnote,.font-archivo .stat .ctx,
.font-archivo .cta-tag,.font-archivo .cta-closing,
.font-archivo .mc-label,.font-archivo .mc-truth-label,
.font-archivo .pull-quote .attribution { font-family:'Spectral', serif; }
</style>
</head>
<body>
<div class="top-bar">
  <select id="sel" onchange="jumpPost(this.value)"></select>
  <button class="nbtn" id="pp" onclick="changePost(-1)">← Post</button>
  <button class="nbtn" id="np" onclick="changePost(1)">Post →</button>
</div>
<div class="post-label" id="plabel"></div>
<div class="frame" id="frame"></div>
<div class="bot-bar">
  <button class="nbtn" id="ps" onclick="changeSlide(-1)">← Slide</button>
  <span class="slide-ctr" id="sctr"></span>
  <button class="nbtn" id="ns" onclick="changeSlide(1)">Slide →</button>
</div>
<script>
// ─── RENDER FUNCTIONS ────────────────────────────────────────────────────────

function sv(post) { return `--accent:${post.color};`; }

function renderCoverPhoto(s, post) {
  if (s.place === 'corner') {
    return `<div class="cover-photo place-corner" style="${sv(post)}">
      <img class="bg" src="${s.img}" alt="">
      <div class="scrim"></div>
      <div class="content">
        <div class="corner-box">
          <span class="badge">${s.badge}</span>
          <h1 class="hook">${s.title}</h1>
          <span class="swipe">${s.swipe || 'swipe →'}</span>
        </div>
      </div>
    </div>`;
  }
  return `<div class="cover-photo place-bottom" style="${sv(post)}">
    <img class="bg" src="${s.img}" alt="">
    <div class="scrim"></div>
    <div class="content">
      <span class="badge">${s.badge}</span>
      <h1 class="hook">${s.title}</h1>
      <span class="swipe">${s.swipe || 'swipe →'}</span>
    </div>
  </div>`;
}

function renderLedger(s, post) {
  const rows = (s.rows || []).map(r => `
    <div class="l-row${r.hi ? ' hi' : ''}">
      <div class="l-num">${r.num}</div>
      <div class="l-sep"></div>
      <div class="l-content">
        ${r.label ? `<div class="l-label">${r.label}</div>` : ''}
        <div class="l-title">${r.title}</div>
        ${r.desc ? `<div class="l-desc">${r.desc}</div>` : ''}
      </div>
    </div>`).join('');
  return `<div class="ledger" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="l-head">
      ${s.section ? `<div class="l-section">${s.section}</div>` : ''}
      <div class="l-head-title">${s.title}</div>
    </div>
    <div class="l-rows">${rows}</div>
  </div>`;
}

function renderChecklist(s, post) {
  const items = (s.items || []).map((it, i) => `
    <div class="ck-item">
      <div class="ck-num${it.tick ? ' tick' : ''}">${i + 1}</div>
      <div class="ck-text">
        <div class="ck-name">${it.name}</div>
        ${it.detail ? `<div class="ck-detail">${it.detail}</div>` : ''}
      </div>
    </div>`).join('');
  return `<div class="checklist" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="ck-head">
      ${s.section ? `<div class="ck-section">${s.section}</div>` : ''}
      <div class="ck-head-title">${s.title}</div>
    </div>
    <div class="ck-items">${items}</div>
  </div>`;
}

function renderEdStep(s, post) {
  return `<div class="ed-step" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="ed-ghost" aria-hidden="true">${s.ghost || ''}</div>
    <div class="ed-top">
      ${s.section ? `<div class="ed-section">${s.section}</div>` : ''}
      ${s.counter ? `<div class="ed-counter">${s.counter}</div>` : ''}
    </div>
    <div class="ed-body">
      <div class="ed-headline">${s.headline}</div>
      ${s.sub ? `<div class="ed-sub">${s.sub}</div>` : ''}
      ${s.pill ? `<div class="ed-pill">${s.pill}</div>` : ''}
    </div>
  </div>`;
}

function renderManifesto(s, post) {
  return `<div class="manifesto" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="big">${s.text}</div>
    ${s.footnote ? `<div class="footnote">${s.footnote}</div>` : ''}
  </div>`;
}

function renderStat(s, post) {
  return `<div class="stat" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="num">${s.num}</div>
    <div class="ctx">${s.ctx}</div>
  </div>`;
}

function renderPullQuote(s, post) {
  return `<div class="pull-quote" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="mark">&ldquo;</div>
    <blockquote>${s.quote}</blockquote>
    ${s.attribution ? `<div class="attribution">${s.attribution}</div>` : ''}
  </div>`;
}

function renderMyth(s, post) {
  return `<div class="myth-card" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="mc-ghost" aria-hidden="true">${s.num || ''}</div>
    <div class="mc-label">Common belief</div>
    <div class="mc-myth">${s.myth}</div>
    <div class="mc-truth-label">What is actually true</div>
    <div class="mc-truth">${s.truth}</div>
  </div>`;
}

function renderCTA(s, post) {
  return `<div class="cta-slide" style="background:${post.bg}; color:${post.text}; ${sv(post)}">
    <div class="cta-tag">${s.tag || 'RESELLER INTEL'}</div>
    <div class="cta-headline">${s.headline}</div>
    <div class="cta-closing">${s.closing}</div>
  </div>`;
}

function buildSlideHTML(s, post) {
  if (s.type === 'cover-photo') return renderCoverPhoto(s, post);
  if (s.type === 'ledger')      return renderLedger(s, post);
  if (s.type === 'checklist')   return renderChecklist(s, post);
  if (s.type === 'ed-step')     return renderEdStep(s, post);
  if (s.type === 'manifesto')   return renderManifesto(s, post);
  if (s.type === 'stat')        return renderStat(s, post);
  if (s.type === 'pull-quote')  return renderPullQuote(s, post);
  if (s.type === 'myth')        return renderMyth(s, post);
  if (s.type === 'cta')         return renderCTA(s, post);
  return `<div style="background:${post.bg};color:${post.text};height:100%;display:flex;align-items:center;justify-content:center;padding:24px;">Unknown type: ${s.type}</div>`;
}

// ─── STATE + NAV ──────────────────────────────────────────────────────────────
let pi = 0, si = 0;

function render() {
  const post = posts[pi];
  const frame = document.getElementById('frame');
  frame.className = `frame ${post.fontClass}`;
  frame.innerHTML = post.slides.map((s, i) =>
    `<div class="slide${i === si ? ' on' : ''}">${buildSlideHTML(s, post)}</div>`
  ).join('');
  document.getElementById('plabel').textContent = post.label;
  document.getElementById('sctr').textContent = `${si + 1} / ${post.slides.length}`;

  const sel = document.getElementById('sel');
  if (!sel.children.length) {
    posts.forEach((p, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = `Post ${i + 1}: ${p.ptitle}`;
      sel.appendChild(o);
    });
  }
  sel.value = pi;
  document.getElementById('pp').disabled = pi === 0;
  document.getElementById('np').disabled = pi === posts.length - 1;
  document.getElementById('ps').disabled = si === 0;
  document.getElementById('ns').disabled = si === post.slides.length - 1;
}

function changeSlide(d) { const n = si + d; if (n >= 0 && n < posts[pi].slides.length) { si = n; render(); } }
function changePost(d)  { const n = pi + d; if (n >= 0 && n < posts.length) { pi = n; si = 0; render(); } }
function jumpPost(v)    { pi = +v; si = 0; render(); }
function gotoSlide(v)   { si = +v; render(); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') changeSlide(1);
  if (e.key === 'ArrowLeft')  changeSlide(-1);
  if (e.key === 'ArrowDown')  changePost(1);
  if (e.key === 'ArrowUp')    changePost(-1);
});

render();
</script>
