<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawli Content Posts — 2026-06-25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 4 fresh pairings, none used in the previous 1-2 batches:
     Newsreader+Roboto (font-news), Poiret One+Didact Gothic (font-deco),
     Bebas Neue+Source Sans 3 (font-bebas), Noto Serif JP+Noto Sans JP (font-jp). -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Roboto:wght@300;400;500;700&family=Poiret+One&family=Didact+Gothic&family=Bebas+Neue&family=Source+Sans+3:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #0d0d0d;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px; gap: 14px;
}

/* ── top bar ── */
.top-bar { width:100%; max-width:440px; display:flex; align-items:center; gap:10px; }
select { flex:1; padding:9px 12px; border-radius:8px; border:1px solid #2a2a2a; background:#1a1a1a; color:#ccc; font-size:13px; cursor:pointer; }
.nbtn { padding:9px 14px; border:1px solid #2a2a2a; border-radius:8px; background:#1a1a1a; color:#aaa; font-size:13px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.nbtn:hover:not(:disabled) { background:#252525; color:#fff; }
.nbtn:disabled { opacity:.3; cursor:default; }
.post-label { width:100%; max-width:440px; font-size:11px; color:#444; text-transform:uppercase; letter-spacing:.1em; }

/* ── slide frame (4:5, matches export-slides.js) ── */
.frame { width:100%; max-width:440px; aspect-ratio:4/5; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 24px 80px rgba(0,0,0,.7); }
.slide { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
.slide.on { display:block; }

.bot-bar { width:100%; max-width:440px; display:flex; align-items:center; justify-content:space-between; }
.slide-ctr { font-size:12px; color:#444; }

/* ════════════ COVER PHOTO (3 placements this batch: centered / top / bottom) ════════════ */
.cover-photo { width:100%; height:100%; position:relative; overflow:hidden; }
.cover-photo .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover-photo .scrim { position:absolute; inset:0; }
/* vertical scrims so the text band stays legible wherever it sits */
.cover-photo.place-bottom .scrim { background:linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.40) 60%, rgba(0,0,0,.78) 100%); }
.cover-photo.place-top    .scrim { background:linear-gradient(0deg,  rgba(0,0,0,.10) 0%, rgba(0,0,0,.40) 60%, rgba(0,0,0,.80) 100%); }
.cover-photo.place-center .scrim { background:radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.40) 55%, rgba(0,0,0,.30) 100%); }
.cover-photo .content { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; color:#fff; gap:14px;
  /* right/bottom safe zone for TikTok chrome */
  padding: 9% 16% 12% 7%; }
.cover-photo.place-bottom .content { justify-content:flex-end; }
.cover-photo.place-top    .content { justify-content:flex-start; }
.cover-photo.place-center .content { justify-content:center; align-items:center; text-align:center; padding:9% 12% 12% 12%; }
.cover-photo .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:100px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.30); font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; width:fit-content; }
.cover-photo .hook { font-size:31px; line-height:1.12; font-weight:800; margin:2px 0 0; text-shadow:0 2px 22px rgba(0,0,0,.55); }
.cover-photo .swipe { font-size:11px; opacity:.82; letter-spacing:.06em; text-transform:uppercase; margin-top:4px; }

/* ════════════ STEP: number-left ════════════ */
.step-nl { width:100%; height:100%; padding:30px 28px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
.step-nl .ghost-num { position:absolute; top:14px; left:22px; font-size:104px; font-weight:900; line-height:1; opacity:.085; letter-spacing:-4px; user-select:none; }
.step-nl .mid-visual { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:52px 0 14px; overflow:hidden; }
.step-nl .mid-visual .vcrd { width:200px; height:200px; max-width:88%; }
.step-nl .text-block { display:flex; flex-direction:column; gap:8px; }
.step-nl .s-label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.55; }
.step-nl .s-title { font-size:26px; font-weight:800; line-height:1.2; }
.step-nl .s-desc  { font-size:14px; line-height:1.6; opacity:.78; }

/* ════════════ STEP: visual-hero (centered) ════════════ */
.step-vh { width:100%; height:100%; padding:30px 26px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; overflow:hidden; }
.step-vh .vcrd { width:184px; height:184px; }
.step-vh .s-label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.5; }
.step-vh .s-title { font-size:24px; font-weight:800; line-height:1.25; }
.step-vh .s-desc  { font-size:13.5px; line-height:1.65; opacity:.74; max-width:320px; }

/* ════════════ STEP: myth (struck myth → bright truth) ════════════ */
.step-myth { width:100%; height:100%; padding:36px 30px; display:flex; flex-direction:column; justify-content:center; gap:14px; position:relative; overflow:hidden; }
.step-myth .ghost-myth-num { position:absolute; top:12px; right:20px; font-size:96px; font-weight:900; line-height:1; opacity:.08; letter-spacing:-3px; user-select:none; }
.step-myth .myth-label { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.5; }
.step-myth .myth-text  { font-size:19px; font-weight:700; line-height:1.35; text-decoration:line-through; opacity:.42; }
.step-myth .truth-label{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.68; margin-top:6px; }
.step-myth .truth-text { font-size:22px; font-weight:800; line-height:1.32; }

/* ════════════ manifesto / pull-quote / stat ════════════ */
.manifesto { width:100%; height:100%; padding:38px 30px; display:flex; flex-direction:column; justify-content:center; gap:16px; }
.manifesto .big { font-weight:800; font-size:34px; line-height:1.14; letter-spacing:-.5px; }
.manifesto .big .hl { font-style:italic; }
.manifesto .footnote { font-size:12px; opacity:.55; letter-spacing:.02em; }

.quote { width:100%; height:100%; padding:38px 30px; display:flex; flex-direction:column; justify-content:center; }
.quote .mark { font-size:84px; line-height:.5; opacity:.22; margin-bottom:12px; }
.quote blockquote { font-style:italic; font-weight:600; font-size:25px; line-height:1.3; letter-spacing:-.3px; }
.quote .attribution { font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.55; margin-top:18px; }

.stat { width:100%; height:100%; padding:38px 30px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
.stat .num { font-size:96px; font-weight:900; line-height:.95; letter-spacing:-2px; }
.stat .ctx { font-size:15px; line-height:1.55; opacity:.78; max-width:300px; }

/* ════════════ cta ════════════ */
.cta-slide { width:100%; height:100%; padding:34px 28px 30px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
.cta-headline { font-size:25px; font-weight:800; line-height:1.28; flex:1; display:flex; align-items:center; }
.cta-desc { font-size:14px; line-height:1.6; opacity:.82; border-top:1px solid rgba(128,128,128,.28); padding-top:14px; margin-top:16px; }
.cta-url { font-size:12px; opacity:.5; margin-top:8px; letter-spacing:.04em; }

/* ════════════ visual card ════════════ */
.vcrd { background:#fbf7ef; border-radius:16px; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 14px 34px rgba(0,0,0,.30); }

/* ════════════ NEUMORPHISM (this batch's fresh, previously-unused style lever) ════════════
   Light page, dark text, soft dual-shadow raised elements. Applied to the three
   font-news posts (2, 5, 8). */
.neu .step-nl, .neu .step-vh, .neu .step-myth, .neu .manifesto, .neu .quote, .neu .stat { background:var(--neubg) !important; }
.neu .vcrd { background:var(--neubg); border-radius:26px; box-shadow:9px 9px 20px rgba(13,30,48,.16), -9px -9px 20px rgba(255,255,255,.92); }
.neu .vcrd svg rect[fill="#fbf7ef"] { fill:var(--neubg); }
.neu .step-myth .truth-text, .neu .manifesto .big .hl, .neu .stat .num { color:var(--accent); }
.neu .cta-desc { border-top-color:rgba(13,30,48,.16); }

/* ════════════ FONT TRACKS (heading vs body per pairing) ════════════ */
/* font-news = Newsreader + Roboto */
.font-news .hook,.font-news .s-title,.font-news .truth-text,.font-news .myth-text,.font-news .manifesto .big,.font-news .quote blockquote,.font-news .cta-headline,.font-news .stat .num { font-family:'Newsreader',Georgia,serif; }
.font-news .badge,.font-news .swipe,.font-news .s-label,.font-news .s-desc,.font-news .myth-label,.font-news .truth-label,.font-news .footnote,.font-news .attribution,.font-news .cta-desc,.font-news .cta-url,.font-news .stat .ctx { font-family:'Roboto',sans-serif; }
/* font-deco = Poiret One + Didact Gothic */
.font-deco .hook,.font-deco .s-title,.font-deco .truth-text,.font-deco .myth-text,.font-deco .manifesto .big,.font-deco .quote blockquote,.font-deco .cta-headline,.font-deco .stat .num { font-family:'Poiret One','Didact Gothic',sans-serif; font-weight:400; letter-spacing:.3px; }
.font-deco .hook { font-weight:400; }
.font-deco .badge,.font-deco .swipe,.font-deco .s-label,.font-deco .s-desc,.font-deco .myth-label,.font-deco .truth-label,.font-deco .footnote,.font-deco .attribution,.font-deco .cta-desc,.font-deco .cta-url,.font-deco .stat .ctx { font-family:'Didact Gothic',sans-serif; }
/* font-bebas = Bebas Neue + Source Sans 3 */
.font-bebas .hook,.font-bebas .s-title,.font-bebas .truth-text,.font-bebas .myth-text,.font-bebas .manifesto .big,.font-bebas .quote blockquote,.font-bebas .cta-headline,.font-bebas .stat .num { font-family:'Bebas Neue',Impact,sans-serif; font-weight:400; letter-spacing:.5px; }
.font-bebas .hook { font-size:40px; line-height:.98; }
.font-bebas .manifesto .big { font-size:46px; line-height:1; }
.font-bebas .badge,.font-bebas .swipe,.font-bebas .s-label,.font-bebas .s-desc,.font-bebas .myth-label,.font-bebas .truth-label,.font-bebas .footnote,.font-bebas .attribution,.font-bebas .cta-desc,.font-bebas .cta-url,.font-bebas .stat .ctx { font-family:'Source Sans 3',sans-serif; }
/* font-jp = Noto Serif JP + Noto Sans JP */
.font-jp .hook,.font-jp .s-title,.font-jp .truth-text,.font-jp .myth-text,.font-jp .manifesto .big,.font-jp .quote blockquote,.font-jp .cta-headline,.font-jp .stat .num { font-family:'Noto Serif JP',serif; font-weight:600; }
.font-jp .badge,.font-jp .swipe,.font-jp .s-label,.font-jp .s-desc,.font-jp .myth-label,.font-jp .truth-label,.font-jp .footnote,.font-jp .attribution,.font-jp .cta-desc,.font-jp .cta-url,.font-jp .stat .ctx { font-family:'Noto Sans JP',sans-serif; font-weight:300; }
.font-deco .hook { font-size:30px; }
</style>
</head>
<body>

<div class="top-bar">
  <button class="nbtn" id="pp" onclick="changePost(-1)">← Post</button>
  <select id="sel" onchange="jumpPost(+this.value)">
    <option value="0">1 · How a Garment Hangs Dates It 🧥</option>
    <option value="1">2 · The Union Label Date Stamp 🏷️</option>
    <option value="2">3 · The Algorithm Is Hiding It 🔍</option>
    <option value="3">4 · Boro &amp; Sashiko 🪡</option>
    <option value="4">5 · A Flawless Bag's Secret 👜</option>
    <option value="5">6 · The Peacoat Was Built for Sea ⚓</option>
    <option value="6">7 · It May Have Walked a Runway ✂️</option>
    <option value="7">8 · Sell Where the Buyer Is 💰</option>

<div class="post-label" id="plabel"></div>

  <button class="nbtn" id="ns" onclick="changeSlide(1)">→</button>
</div>

<script>
// ─── Crawli logo ───────────────────────────────────────────────────────────
const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="158" height="47">
  <defs><linearGradient id="cg3" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#E24B4A"/><stop offset="25%" stop-color="#E84D1D"/>
    <stop offset="50%" stop-color="#D85A30"/><stop offset="75%" stop-color="#EF9F27"/>
    <stop offset="100%" stop-color="#FAC775"/></linearGradient></defs>
  <text x="100" y="46" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
    font-size="52" font-weight="700" letter-spacing="-1" fill="url(#cg3)">Crawli</text>
</svg>`;

// ─── Flat clipart object illustrations (cream card, accent + fixed tints) ────
// Moving imagery off pure line-symbols toward flat colored clipart (was 0% in history).
const T = { card:'#fbf7ef', ink:'#2f2a25', wood:'#bd9162', woodD:'#946b40', thread:'#efe9db',
  red:'#b5392f', blue:'#2f4d8c', white:'#ffffff', shadow:'rgba(47,42,37,.14)' };
const LIGHT = 'rgba(255,255,255,.45)';

function cw(inner){ return `<svg viewBox="0 0 180 180" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="180" height="180" fill="${T.card}"/>${inner}</svg>`; }
function hanger(){ return `<path d="M90 38 q0 -9 7 -9 q4 0 4 4" fill="none" stroke="${T.woodD}" stroke-width="3" stroke-linecap="round"/><path d="M56 54 L90 40 L124 54" fill="none" stroke="${T.wood}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`; }

const CL = {
  // ── P1 hanger-dating dresses ──
  dress30s: c=>cw(`${hanger()}<path d="M76 54 Q90 49 104 54 L110 96 Q113 142 92 156 L84 151 Q70 120 70 98 Z" fill="${c}"/><path d="M82 64 L100 150" stroke="${LIGHT}" stroke-width="2.5" opacity=".6"/>`),
  dress40s: c=>cw(`${hanger()}<path d="M60 56 L120 56 L114 76 L100 82 L100 96 L118 142 L62 142 L80 96 L80 82 L66 76 Z" fill="${c}"/><rect x="80" y="92" width="20" height="7" fill="${T.ink}" opacity=".55"/>`),
  dress70s: c=>cw(`${hanger()}<path d="M70 54 Q90 66 110 54 L105 74 Q124 152 90 158 Q56 152 75 74 Z" fill="${c}"/><path d="M82 54 L90 66 L98 54 Z" fill="${LIGHT}"/>`),
  dress80s: c=>cw(`${hanger()}<path d="M54 56 Q68 47 80 57 L100 57 Q112 47 126 56 L113 80 L106 124 L74 124 L67 80 Z" fill="${c}"/><path d="M80 57 L100 57 L98 70 L82 70 Z" fill="${LIGHT}" opacity=".5"/>`),
  // ── P2 union labels ──
  labelShield: c=>cw(`<path d="M90 50 L122 61 L122 92 Q122 120 90 134 Q58 120 58 92 L58 61 Z" fill="${T.white}" stroke="${c}" stroke-width="4"/><rect x="66" y="66" width="48" height="9" fill="${T.red}"/><rect x="66" y="79" width="48" height="9" fill="${T.blue}"/><path d="M76 100 L90 110 L104 100" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`),
  labelOval: c=>cw(`<ellipse cx="90" cy="90" rx="46" ry="30" fill="${T.white}" stroke="${c}" stroke-width="4"/><rect x="58" y="80" width="64" height="8" fill="${T.blue}"/><rect x="68" y="94" width="44" height="6" fill="${c}" opacity=".55"/>`),
  labelWoven: c=>cw(`<g fill="${T.wood}"><circle cx="64" cy="66" r="2.4"/><circle cx="80" cy="66" r="2.4"/><circle cx="96" cy="66" r="2.4"/><circle cx="112" cy="66" r="2.4"/></g><rect x="58" y="72" width="64" height="34" rx="3" fill="${T.white}" stroke="${c}" stroke-width="3"/><rect x="65" y="81" width="50" height="6" fill="${T.red}"/><rect x="65" y="92" width="34" height="5" fill="${T.red}" opacity=".7"/>`),
  labelRect: c=>cw(`<rect x="55" y="70" width="70" height="40" rx="2" fill="${T.white}" stroke="${c}" stroke-width="3"/><circle cx="71" cy="90" r="9" fill="none" stroke="${c}" stroke-width="3"/><circle cx="71" cy="90" r="3" fill="${c}"/><rect x="88" y="83" width="30" height="6" fill="${c}" opacity=".6"/><rect x="88" y="94" width="22" height="5" fill="${c}" opacity=".4"/>`),
  // ── P4 boro / sashiko ──
  patchBoro: c=>cw(`<rect x="48" y="50" width="84" height="84" fill="${c}"/><rect x="58" y="44" width="48" height="48" fill="${T.blue}"/><rect x="92" y="86" width="42" height="46" fill="${T.ink}" opacity=".55"/><g stroke="${T.thread}" stroke-width="2.4" stroke-dasharray="5 5" opacity=".85"><line x1="58" y1="68" x2="106" y2="68"/><line x1="92" y1="108" x2="134" y2="108"/><line x1="74" y1="50" x2="74" y2="92"/></g>`),
  sashikoStitch: c=>cw(`<rect x="46" y="46" width="88" height="88" fill="${c}"/><g stroke="${T.thread}" stroke-width="2.6" stroke-dasharray="6 5" fill="none" opacity=".9"><path d="M46 90 L90 46 L134 90 L90 134 Z"/><path d="M68 68 L112 112 M112 68 L68 112"/></g>`),
  indigoFade: c=>cw(`<rect x="44" y="74" width="24" height="40" fill="${T.ink}" opacity=".7"/><rect x="70" y="74" width="24" height="40" fill="${c}"/><rect x="96" y="74" width="24" height="40" fill="${T.blue}" opacity=".7"/><rect x="122" y="74" width="20" height="40" fill="${T.blue}" opacity=".4"/>`),
  needleThread: c=>cw(`<line x1="52" y1="120" x2="120" y2="58" stroke="${T.wood}" stroke-width="3"/><circle cx="120" cy="58" r="5" fill="none" stroke="${T.wood}" stroke-width="3"/><path d="M58 124 q24 6 30 -14 q6 -20 30 -16" fill="none" stroke="${c}" stroke-width="2.6" stroke-dasharray="5 5"/>`),
  // ── P5 repaint signs ──
  stitchHole: c=>cw(`<line x1="40" y1="90" x2="140" y2="90" stroke="${T.ink}" stroke-width="2.4" opacity=".55"/><g><circle cx="56" cy="90" r="6" fill="${c}"/><circle cx="78" cy="90" r="6" fill="${c}"/><circle cx="100" cy="90" r="6" fill="${c}"/><circle cx="122" cy="90" r="6" fill="${c}"/></g><g fill="${T.white}"><circle cx="56" cy="90" r="2"/><circle cx="78" cy="90" r="2"/><circle cx="100" cy="90" r="2"/><circle cx="122" cy="90" r="2"/></g><path d="M50 78 q6 -6 12 0 M72 78 q6 -6 12 0 M94 78 q6 -6 12 0 M116 78 q6 -6 12 0" fill="none" stroke="${c}" stroke-width="2" opacity=".5"/>`),
  edgeCross: c=>cw(`<rect x="44" y="72" width="92" height="10" fill="${c}"/><rect x="44" y="82" width="92" height="9" fill="${T.ink}" opacity=".55"/><rect x="44" y="91" width="92" height="9" fill="${T.wood}"/><rect x="44" y="66" width="92" height="6" fill="${LIGHT}"/><path d="M44 66 q46 -10 92 0" fill="none" stroke="${c}" stroke-width="2.4" opacity=".6"/>`),
  interiorCompare: c=>cw(`<rect x="46" y="58" width="44" height="64" rx="4" fill="${c}"/><rect x="92" y="58" width="44" height="64" rx="4" fill="${c}" opacity=".42"/><line x1="91" y1="54" x2="91" y2="126" stroke="${T.ink}" stroke-width="2" stroke-dasharray="4 4" opacity=".5"/><text x="68" y="135" text-anchor="middle" font-size="11" fill="${T.ink}" opacity=".6" font-family="system-ui">out</text><text x="114" y="135" text-anchor="middle" font-size="11" fill="${T.ink}" opacity=".6" font-family="system-ui">in</text>`),
  solvent: c=>cw(`<path d="M90 56 q18 28 18 42 a18 18 0 0 1 -36 0 q0 -14 18 -42 Z" fill="${c}"/><path d="M84 96 a8 8 0 0 0 8 8" fill="none" stroke="${T.white}" stroke-width="3" stroke-linecap="round" opacity=".8"/><g stroke="${T.wood}" stroke-width="2.4" stroke-linecap="round"><path d="M120 70 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="${T.wood}" stroke="none"/></g>`),
  // ── P6 peacoat ──

// ─── CTA ────────────────────────────────────────────────────────────────────
function ctaHTML(s, post) {
  return `<div class="cta-slide" style="background:${post.bg}; color:${post.text}; align-items:center; text-align:center; --accent:${post.color}; --neubg:${post.neubg||''};">
    <div style="display:flex;justify-content:center;margin-bottom:12px;">${LOGO}</div>
    <div class="cta-headline" style="text-align:center;">${s.headline}</div>
    <div>
      <div class="cta-desc" style="text-align:left;"><strong>Crawli:</strong> ${s.crawli}</div>
      <div class="cta-url">thecrawli.com</div>
    </div>
  </div>`;
}

function renderCoverPhoto(s, post) {
  const place = `place-${s.place || 'bottom'}`;
  return `<div class="cover-photo ${place}" style="--accent:${post.color};">
    <img class="bg" src="${s.img}" alt="">
    <div class="scrim"></div>
    <div class="content">
      <span class="badge">${s.badge}</span>
      <h1 class="hook">${s.title}</h1>
      <span class="swipe">${s.swipe || 'Swipe →'}</span>
    </div>
  </div>`;
}

function styleVars(post){ return `--accent:${post.color}; --neubg:${post.neubg||''};`; }
function visual(s, c){ return CL[s.illo] ? `<div class="vcrd">${CL[s.illo](c)}</div>` : ''; }

function renderNumberLeft(s, post) {
  return `<div class="step-nl" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="ghost-num">${s.num}</div>
    <div class="mid-visual">${visual(s, post.color)}</div>
    <div class="text-block">
      <div class="s-label">${s.label}</div>
      <div class="s-title">${s.title}</div>
      <div class="s-desc">${s.desc}</div>
    </div>
  </div>`;
}

function renderVisualHero(s, post) {
  return `<div class="step-vh" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    ${visual(s, post.color)}
    <div class="s-label">${s.label}</div>
    <div class="s-title">${s.title}</div>
    <div class="s-desc">${s.desc}</div>
  </div>`;
}

function renderMyth(s, post) {
  return `<div class="step-myth" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="ghost-myth-num">${s.num}</div>
    <div class="myth-label">Myth</div>
    <div class="myth-text">${s.myth}</div>
    <div class="truth-label">Actually</div>
    <div class="truth-text">${s.truth}</div>
  </div>`;
}

function renderManifesto(s, post) {
  return `<div class="manifesto" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="big">${s.text}</div>
    ${s.footnote ? `<div class="footnote">${s.footnote}</div>` : ''}
  </div>`;
}
function renderQuote(s, post) {
  return `<div class="quote" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="mark">&ldquo;</div>
    <blockquote>${s.quote}</blockquote>
    ${s.attribution ? `<div class="attribution">${s.attribution}</div>` : ''}
  </div>`;
}
function renderStat(s, post) {
  return `<div class="stat" style="background:${post.bg}; color:${post.text}; ${styleVars(post)}">
    <div class="num">${s.num}</div>
    <div class="ctx">${s.ctx}</div>
  </div>`;
}

function buildSlideHTML(s, post) {
  if (s.type === 'cover-photo') return renderCoverPhoto(s, post);
  if (s.type === 'cta')         return ctaHTML(s, post);
  if (s.type === 'manifesto')   return renderManifesto(s, post);
  if (s.type === 'pull-quote')  return renderQuote(s, post);
  if (s.type === 'stat')        return renderStat(s, post);
  if (s.type === 'myth')        return renderMyth(s, post);
  if (post.layout === 'number-left') return renderNumberLeft(s, post);
  return renderVisualHero(s, post);
}

// ─── STATE + NAV ──────────────────────────────────────────────────────────────
let pi = 0, si = 0;
function render() {
  const post = posts[pi];
  const frame = document.getElementById('frame');
  frame.className = `frame ${post.fontClass} ${post.styleClass}`;
  frame.innerHTML = post.slides.map((s,i) =>
    `<div class="slide${i===si?' on':''}">${buildSlideHTML(s, post)}</div>`
  ).join('');
  document.getElementById('plabel').textContent = post.label;
  document.getElementById('sctr').textContent = `${si+1} / ${post.slides.length}`;
  document.getElementById('pp').disabled = pi === 0;
  document.getElementById('np').disabled = pi === posts.length-1;
  document.getElementById('ps').disabled = si === 0;
  document.getElementById('ns').disabled = si === post.slides.length-1;
  document.getElementById('sel').value = pi;
}
function changeSlide(d){ const n=si+d; if(n>=0 && n<posts[pi].slides.length){ si=n; render(); } }
function changePost(d){ const n=pi+d; if(n>=0 && n<posts.length){ pi=n; si=0; render(); } }
function jumpPost(v){ pi=+v; si=0; render(); }
function gotoSlide(v){ si=+v; render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') changeSlide(1);
  if(e.key==='ArrowLeft')  changeSlide(-1);
  if(e.key==='ArrowDown')  changePost(1);
  if(e.key==='ArrowUp')    changePost(-1);
});
render();
</script>
