<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rick Hook Slide — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#111;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px;
  }
  .slide {
    width:1080px; height:1350px;
    transform: scale(0.55);
    transform-origin: center center;
    position:relative;
    overflow:hidden;
    background:#000;
    box-shadow:0 30px 100px rgba(0,0,0,.8);
    border-radius:4px;
  }
  .slide img.bg {
    position:absolute; top:0; left:0; width:100%; height:68%;
    object-fit:cover; object-position:center 12%;
  }
  .slide .top-scrim {
    position:absolute; top:0; left:0; width:100%; height:18%;
    background:linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 100%);
  }
  .bottom-scrim {
    position:absolute; left:0; bottom:0; width:100%; height:46%;
    background:linear-gradient(180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.25) 25%,
      rgba(0,0,0,.65) 45%,
      rgba(3,3,3,.92) 60%,
      #050505 72%,
      #050505 100%);
  }
  .swipe-badge {
    position:absolute; top:5%; right:6%; z-index:2;
    display:flex; align-items:center; gap:10px;
    background:rgba(0,0,0,.55);
    border:2px solid rgba(255,255,255,.85);
    border-radius:100px;
    padding:14px 26px 14px 30px;
    font-family:'Inter',sans-serif; font-weight:700;
    font-size:28px; letter-spacing:.08em;
    color:#fff; text-transform:uppercase;
  }
  .swipe-badge .chevrons { display:flex; gap:2px; font-size:22px; line-height:1; color:#ff6a1a; }
  .caption-block {
    position:absolute; left:0; bottom:0; width:100%; height:40%;
    z-index:1;
    padding:0 64px 60px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .rule-row {
    display:flex; align-items:center; gap:16px;
    margin-bottom:30px;
  }
  .rule-row .line { flex:1; height:2px; background:rgba(255,255,255,.4); }
  .logo-lockup { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .logo-lockup .mark {
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(90deg,#E24B4A 0%,#D85A30 50%,#FAC775 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-weight:700; font-size:15px; color:#fff; letter-spacing:-.5px;
  }
  .logo-lockup .word {
    font-family:'Inter',sans-serif; font-weight:700; font-size:26px;
    letter-spacing:-.01em; color:#fff;
  }
  .headline {
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:66px;
    line-height:1.08;
    letter-spacing:.005em;
    text-transform:uppercase;
    color:#fff;
  }
  .headline .accent { color:#ff6a1a; }
</style>
</head>
<body>

<div class="slide">
  <img class="bg" src="rick-hook.jpeg" alt="Rick holding an armful of resale clothing">
  <div class="top-scrim"></div>
  <div class="bottom-scrim"></div>

  <div class="swipe-badge">
    <span>Swipe</span>
    <span class="chevrons">&#8250;&#8250;</span>
  </div>

  <div class="caption-block">
    <div class="rule-row">
      <div class="line"></div>
      <div class="logo-lockup">
        <div class="mark">Cr</div>
        <div class="word">Crawli</div>
      </div>
      <div class="line"></div>
    </div>
    <div class="headline">
      How a <span class="accent">broken cell phone</span> turned into a <span class="accent">multi-million dollar</span> reselling empire
    </div>
  </div>
</div>

</body>
</html>
