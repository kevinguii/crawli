<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Fabric swatch with thread weave detail">
  <rect width="1200" height="630" fill="#ffffff"/>
  <circle cx="600" cy="315" r="220" fill="#f3e8ff"/>

  <!-- Fabric swatch -->
  <rect x="480" y="195" width="240" height="240" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="12"/>

  <!-- Weave lines -->
  <line x1="480" y1="255" x2="720" y2="255" stroke="#7e22ce" stroke-width="6" opacity="0.5"/>
  <line x1="480" y1="315" x2="720" y2="315" stroke="#7e22ce" stroke-width="6" opacity="0.5"/>
  <line x1="480" y1="375" x2="720" y2="375" stroke="#7e22ce" stroke-width="6" opacity="0.5"/>
  <line x1="540" y1="195" x2="540" y2="435" stroke="#7e22ce" stroke-width="6" opacity="0.5"/>
  <line x1="600" y1="195" x2="600" y2="435" stroke="#7e22ce" stroke-width="6" opacity="0.5"/>
  <line x1="660" y1="195" x2="660" y2="435" stroke="#7e22ce" stroke-width="6" opacity="0.5"/>

  <!-- Loose thread -->
  <path d="M 720 375 C 770 380 790 410 770 450 C 755 480 720 470 730 445"
        fill="none" stroke="#7e22ce" stroke-width="10" stroke-linecap="round"/>
</svg>
