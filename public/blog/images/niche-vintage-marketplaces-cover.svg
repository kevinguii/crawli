<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Faceted gem">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Halo -->
  <circle cx="600" cy="315" r="220" fill="#fdf2f8"/>

  <!-- Gem outline -->
  <polygon points="600,140 740,260 600,500 460,260" fill="none" stroke="#db2777" stroke-width="16" stroke-linejoin="round"/>

  <!-- Top facet edges -->
  <line x1="460" y1="260" x2="740" y2="260" stroke="#db2777" stroke-width="10" stroke-linecap="round"/>
  <line x1="540" y1="260" x2="600" y2="140" stroke="#db2777" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="660" y1="260" x2="600" y2="140" stroke="#db2777" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Lower facet shine -->
  <polygon points="600,260 660,260 600,420 540,260" fill="#db2777" opacity="0.18"/>
  <polygon points="600,260 540,260 600,420" fill="#db2777" opacity="0.12"/>
</svg>
