<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#431407"/>
  <!-- Plaid pattern (Pendleton-style) -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#7c2d12" stroke-width="12" opacity="0.6"/>
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#7c2d12" stroke-width="6" opacity="0.5"/>
  <line x1="0" y1="340" x2="1200" y2="340" stroke="#7c2d12" stroke-width="12" opacity="0.6"/>
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#7c2d12" stroke-width="6" opacity="0.5"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#7c2d12" stroke-width="12" opacity="0.6"/>
  <line x1="150" y1="0" x2="150" y2="630" stroke="#7c2d12" stroke-width="10" opacity="0.5"/>
  <line x1="350" y1="0" x2="350" y2="630" stroke="#7c2d12" stroke-width="5" opacity="0.4"/>
  <line x1="550" y1="0" x2="550" y2="630" stroke="#7c2d12" stroke-width="10" opacity="0.5"/>
  <line x1="750" y1="0" x2="750" y2="630" stroke="#7c2d12" stroke-width="5" opacity="0.4"/>
  <line x1="950" y1="0" x2="950" y2="630" stroke="#7c2d12" stroke-width="10" opacity="0.5"/>
  <line x1="1150" y1="0" x2="1150" y2="630" stroke="#7c2d12" stroke-width="5" opacity="0.4"/>
  <!-- Price tags for three platforms -->
  <rect x="80" y="420" width="150" height="80" rx="6" fill="#1c1917" opacity="0.85" stroke="#fdba74" stroke-width="1.5"/>
  <text x="155" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#fdba74" text-anchor="middle">eBay</text>
  <text x="155" y="483" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#fef3c7" text-anchor="middle">$140</text>
  <rect x="525" y="440" width="150" height="80" rx="6" fill="#1c1917" opacity="0.85" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="600" y="470" font-family="system-ui, sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle">Poshmark</text>
  <text x="600" y="503" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#fef3c7" text-anchor="middle">$110</text>
  <rect x="970" y="455" width="150" height="80" rx="6" fill="#1c1917" opacity="0.85" stroke="#f97316" stroke-width="1.5"/>
  <text x="1045" y="485" font-family="system-ui, sans-serif" font-size="13" fill="#f97316" text-anchor="middle">Depop</text>
  <text x="1045" y="518" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#fef3c7" text-anchor="middle">$95</text>
  <!-- 40% badge -->
  <circle cx="600" cy="200" r="65" fill="#92400e" opacity="0.7"/>
  <text x="600" y="193" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#fef3c7" text-anchor="middle">40%</text>
  <text x="600" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#fde68a" text-anchor="middle">price gap</text>
  <!-- Main text -->
  <text x="600" y="310" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#fef9f0" text-anchor="middle">Same 1960s Pendleton.</text>
  <text x="600" y="360" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#fef9f0" text-anchor="middle">Three Platforms.</text>
  <text x="600" y="405" font-family="Georgia, serif" font-size="24" fill="#fcd34d" text-anchor="middle">The sale price varied by 40%.</text>
  <!-- Crawli badge -->
  <rect x="530" y="565" width="140" height="34" rx="17" fill="#78350f" opacity="0.8"/>
  <text x="600" y="587" font-family="system-ui, sans-serif" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">thecrawli.com</text>
</svg>
