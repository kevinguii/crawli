<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Retro track jacket silhouette with side stripes representing 1970s athletic club wear">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Halo -->
  <circle cx="600" cy="300" r="220" fill="#fef3e2"/>

  <!-- Track jacket body -->
  <path d="M 520 200 L 470 240 L 480 440 L 560 440 L 570 260 L 630 260 L 640 440 L 720 440 L 730 240 L 680 200 L 640 230 L 560 230 Z"
        fill="none" stroke="#b45309" stroke-width="10" stroke-linejoin="round"/>

  <!-- Zipper line -->
  <line x1="600" y1="235" x2="600" y2="435" stroke="#b45309" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Side stripes, left sleeve -->
  <line x1="490" y1="260" x2="478" y2="420" stroke="#b45309" stroke-width="6" opacity="0.45"/>
  <line x1="502" y1="260" x2="490" y2="420" stroke="#b45309" stroke-width="6" opacity="0.45"/>

  <!-- Side stripes, right sleeve -->
  <line x1="710" y1="260" x2="722" y2="420" stroke="#b45309" stroke-width="6" opacity="0.45"/>
  <line x1="698" y1="260" x2="710" y2="420" stroke="#b45309" stroke-width="6" opacity="0.45"/>

  <!-- Club crest -->
  <circle cx="555" cy="290" r="16" fill="none" stroke="#b45309" stroke-width="5"/>

  <text x="600" y="510" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">1970s club &amp; team athletic wear</text>
</svg>
