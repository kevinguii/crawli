<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1e1b4b"/>
  <!-- Clock/timer circle -->
  <circle cx="600" cy="200" r="110" fill="none" stroke="#4f46e5" stroke-width="3" opacity="0.5"/>
  <circle cx="600" cy="200" r="90" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <!-- Clock hands showing 90 seconds (1:30 position) -->
  <line x1="600" y1="200" x2="600" y2="110" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="600" y1="200" x2="648" y2="242" stroke="#c7d2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="600" cy="200" r="6" fill="#818cf8"/>
  <!-- 90 sec label -->
  <text x="600" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" opacity="0.8">90 sec</text>
  <!-- Checkmark / X symbols -->
  <text x="220" y="230" font-family="system-ui, sans-serif" font-size="60" fill="#4ade80" opacity="0.6">✓</text>
  <text x="900" y="230" font-family="system-ui, sans-serif" font-size="60" fill="#f87171" opacity="0.6">✗</text>
  <text x="160" y="270" font-family="system-ui, sans-serif" font-size="13" fill="#86efac" text-anchor="middle" opacity="0.7">obvious fake</text>
  <text x="960" y="270" font-family="system-ui, sans-serif" font-size="13" fill="#fca5a5" text-anchor="middle" opacity="0.7">vintage + repairs</text>
  <!-- Main text -->
  <text x="600" y="385" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#eef2ff" text-anchor="middle">When Vestiaire Says</text>
  <text x="600" y="440" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#eef2ff" text-anchor="middle">'Authenticated'</text>
  <text x="600" y="490" font-family="Georgia, serif" font-size="26" fill="#a5b4fc" text-anchor="middle">They Mean a Human Looked at Your Bag</text>
  <text x="600" y="530" font-family="Georgia, serif" font-size="26" fill="#a5b4fc" text-anchor="middle">for 90 Seconds.</text>
  <!-- Crawli badge -->
  <rect x="530" y="575" width="140" height="34" rx="17" fill="#3730a3" opacity="0.8"/>
  <text x="600" y="597" font-family="system-ui, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle" font-weight="600">thecrawli.com</text>
</svg>
