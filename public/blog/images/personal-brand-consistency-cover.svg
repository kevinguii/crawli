<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three interlocking circles">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Halo -->
  <circle cx="600" cy="315" r="220" fill="#f1f5f9"/>

  <!-- Three interlocking rings -->
  <circle cx="540" cy="250" r="110" fill="none" stroke="#475569" stroke-width="16"/>
  <circle cx="660" cy="250" r="110" fill="none" stroke="#475569" stroke-width="16"/>
  <circle cx="600" cy="360" r="110" fill="none" stroke="#475569" stroke-width="16"/>

  <!-- Overlap tint -->
  <circle cx="540" cy="250" r="110" fill="#475569" opacity="0.06"/>
  <circle cx="660" cy="250" r="110" fill="#475569" opacity="0.06"/>
  <circle cx="600" cy="360" r="110" fill="#475569" opacity="0.06"/>
</svg>
