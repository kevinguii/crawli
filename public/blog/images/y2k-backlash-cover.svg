<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Split halves: Y2K chaos left, minimalism right -->
  <rect x="0" y="0" width="580" height="630" fill="#1e293b" opacity="0.6"/>
  <!-- Y2K side: sparkles and logos (left) -->
  <circle cx="100" cy="100" r="4" fill="#f472b6" opacity="0.8"/>
  <circle cx="180" cy="60" r="6" fill="#c084fc" opacity="0.7"/>
  <circle cx="300" cy="120" r="3" fill="#fb923c" opacity="0.8"/>
  <circle cx="450" cy="80" r="5" fill="#f472b6" opacity="0.6"/>
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="60" fill="#f472b6" opacity="0.4" font-weight="900">Y2K</text>
  <text x="120" y="270" font-family="system-ui, sans-serif" font-size="40" fill="#c084fc" opacity="0.3" font-weight="900">MAX</text>
  <text x="60" y="340" font-family="system-ui, sans-serif" font-size="35" fill="#fb923c" opacity="0.3" font-weight="900">LOGO</text>
  <!-- Arrow divider -->
  <line x1="600" y1="50" x2="600" y2="580" stroke="#475569" stroke-width="2" stroke-dasharray="8,6"/>
  <polygon points="580,310 620,310 600,350" fill="#64748b" opacity="0.8"/>
  <!-- Minimalism right side: clean lines -->
  <rect x="700" y="150" width="380" height="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="750" y="200" width="280" height="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="700" y="440" width="380" height="2" fill="#94a3b8" opacity="0.4"/>
  <!-- Main text -->
  <text x="600" y="430" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#f1f5f9" text-anchor="middle">Y2K Will Not Peak in 2026.</text>
  <text x="600" y="490" font-family="Georgia, serif" font-size="32" fill="#94a3b8" text-anchor="middle">The Anti-Y2K Reaction Is Already Starting.</text>
  <text x="600" y="535" font-family="system-ui, sans-serif" font-size="19" fill="#cbd5e1" text-anchor="middle" opacity="0.75">Old Celine · Helmut Lang · Quiet Luxury · Early 2010s Minimalism</text>
  <!-- Crawli badge -->
  <rect x="530" y="575" width="140" height="34" rx="17" fill="#334155" opacity="0.8"/>
  <text x="600" y="597" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="600">thecrawli.com</text>
</svg>
