<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Blog cover">
  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Price tag icon -->
  <g transform="translate(600, 315)">
    <!-- Tag outline -->
    <path d="M -70 -50 L 50 -50 L 90 0 L 50 50 L -70 50 C -90 50 -105 35 -105 15 L -105 -15 C -105 -35 -90 -50 -70 -50 Z"
          fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Dollar sign -->
    <text x="5" y="20" font-size="80" font-weight="700" text-anchor="middle" fill="#2563eb">$</text>
  </g>
</svg>
