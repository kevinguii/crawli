<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Grid of cards with one highlighted">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- 2x2 grid, centered on 600,315. Cards 220x140, gap 20. Total 460x300. Start at 370,165 -->

  <!-- Top-left card -->
  <rect x="370" y="165" width="220" height="140" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="5" opacity="0.5"/>
  <!-- Top-right card -->
  <rect x="610" y="165" width="220" height="140" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="5" opacity="0.5"/>
  <!-- Bottom-left card -->
  <rect x="370" y="325" width="220" height="140" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="5" opacity="0.5"/>

  <!-- Bottom-right card: highlighted -->
  <rect x="610" y="325" width="220" height="140" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="8"/>

  <!-- Star on highlighted card (centered at 720, 395) -->
  <polygon points="720,345 734,382 773,382 742,405 754,442 720,420 686,442 698,405 667,382 706,382"
           fill="#16a34a"/>

  <!-- Placeholder lines on other 3 cards -->
  <line x1="400" y1="215" x2="560" y2="215" stroke="#86efac" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="400" y1="239" x2="530" y2="239" stroke="#86efac" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <line x1="640" y1="215" x2="800" y2="215" stroke="#86efac" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="640" y1="239" x2="770" y2="239" stroke="#86efac" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <line x1="400" y1="375" x2="560" y2="375" stroke="#86efac" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="400" y1="399" x2="530" y2="399" stroke="#86efac" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>
