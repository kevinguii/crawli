<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#172554"/>
  <!-- Denim selvedge stripes -->
  <rect x="0" y="0" width="1200" height="8" fill="#1e3a8a" opacity="0.6"/>
  <rect x="0" y="50" width="1200" height="4" fill="#1d4ed8" opacity="0.3"/>
  <rect x="0" y="580" width="1200" height="8" fill="#1e3a8a" opacity="0.6"/>
  <rect x="0" y="540" width="1200" height="4" fill="#1d4ed8" opacity="0.3"/>
  <!-- Tape measure graphic -->
  <rect x="350" y="300" width="500" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <!-- Ruler ticks -->
  <line x1="380" y1="300" x2="380" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="420" y1="300" x2="420" y2="330" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="460" y1="300" x2="460" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="500" y1="300" x2="500" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="540" y1="300" x2="540" y2="330" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="580" y1="300" x2="580" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="620" y1="300" x2="620" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="660" y1="300" x2="660" y2="330" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="700" y1="300" x2="700" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="740" y1="300" x2="740" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="780" y1="300" x2="780" y2="330" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="820" y1="300" x2="820" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <!-- Measurement labels -->
  <text x="420" y="350" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">28"</text>
  <text x="540" y="350" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">30"</text>
  <text x="660" y="350" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">32"</text>
  <text x="780" y="350" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">34"</text>
  <!-- Red tab icon -->
  <rect x="570" y="200" width="60" height="30" rx="2" fill="#dc2626" opacity="0.85"/>
  <text x="600" y="221" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">LEVI'S</text>
  <!-- Tag with X through size -->
  <rect x="880" y="230" width="90" height="55" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="925" y="263" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#93c5fd" text-anchor="middle">32</text>
  <line x1="882" y1="232" x2="968" y2="283" stroke="#f87171" stroke-width="3" opacity="0.9"/>
  <line x1="968" y1="232" x2="882" y2="283" stroke="#f87171" stroke-width="3" opacity="0.9"/>
  <!-- Main text -->
  <text x="600" y="120" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#eff6ff" text-anchor="middle">Stop Buying Vintage 501s</text>
  <text x="600" y="178" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#eff6ff" text-anchor="middle">Based on Tag Size.</text>
  <text x="600" y="238" font-family="Georgia, serif" font-size="26" fill="#93c5fd" text-anchor="middle">The Only Number That Matters</text>
  <text x="600" y="272" font-family="Georgia, serif" font-size="26" fill="#93c5fd" text-anchor="middle">Is the Waist Measurement.</text>
  <!-- Crawli badge -->
  <rect x="530" y="545" width="140" height="36" rx="18" fill="#1e3a8a" opacity="0.8"/>
  <text x="600" y="568" font-family="system-ui, sans-serif" font-size="14" fill="#bfdbfe" text-anchor="middle" font-weight="600">thecrawli.com</text>
</svg>
