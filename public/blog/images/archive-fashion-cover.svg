<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Clothes hanger">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Hanger hook (top) -->
  <path d="M 600 140 C 600 100 650 90 660 120 C 670 145 648 158 630 165"
        fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>

  <!-- Hanger body: triangle shape -->
  <path d="M 630 165 L 840 420 L 360 420 Z"
        fill="#eff6ff" stroke="#2563eb" stroke-width="12" stroke-linejoin="round"/>

  <!-- Horizontal crossbar at bottom of triangle -->
  <line x1="310" y1="420" x2="890" y2="420" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
</svg>
