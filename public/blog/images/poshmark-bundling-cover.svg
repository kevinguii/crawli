<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#042f2e"/>
  <!-- Bundle boxes -->
  <rect x="360" y="280" width="160" height="180" rx="6" fill="#0f4d4b" stroke="#14b8a6" stroke-width="2"/>
  <rect x="500" y="260" width="160" height="180" rx="6" fill="#0f4d4b" stroke="#14b8a6" stroke-width="2"/>
  <rect x="540" y="300" width="160" height="180" rx="6" fill="#155e59" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Items in boxes (little clothing icons) -->
  <text x="440" y="390" font-family="system-ui, sans-serif" font-size="40" text-anchor="middle" opacity="0.7">👚</text>
  <text x="580" y="370" font-family="system-ui, sans-serif" font-size="40" text-anchor="middle" opacity="0.7">👖</text>
  <text x="620" y="410" font-family="system-ui, sans-serif" font-size="40" text-anchor="middle" opacity="0.7">👗</text>
  <!-- Arrow up = revenue up -->
  <path d="M900 480 L900 200" stroke="#2dd4bf" stroke-width="4" opacity="0.7"/>
  <polygon points="880,210 920,210 900,180" fill="#2dd4bf" opacity="0.7"/>
  <text x="940" y="350" font-family="system-ui, sans-serif" font-size="18" fill="#5eead4" opacity="0.8">avg order</text>
  <text x="940" y="375" font-family="system-ui, sans-serif" font-size="18" fill="#5eead4" opacity="0.8">value up</text>
  <!-- 20% badge -->
  <circle cx="200" cy="300" r="70" fill="#0f766e" opacity="0.6"/>
  <text x="200" y="295" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#ccfbf1" text-anchor="middle">20%</text>
  <text x="200" y="325" font-family="system-ui, sans-serif" font-size="14" fill="#99f6e4" text-anchor="middle">bundle off</text>
  <!-- Main text -->
  <text x="600" y="120" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#f0fdfa" text-anchor="middle">Poshmark Sales Are Down</text>
  <text x="600" y="175" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#f0fdfa" text-anchor="middle">for Everyone.</text>
  <text x="600" y="235" font-family="Georgia, serif" font-size="26" fill="#5eead4" text-anchor="middle">Resellers Who Switched to Bundling</text>
  <text x="600" y="270" font-family="Georgia, serif" font-size="26" fill="#5eead4" text-anchor="middle">Are Still Hitting Their Numbers.</text>
  <!-- Crawli badge -->
  <rect x="530" y="555" width="140" height="34" rx="17" fill="#0f766e" opacity="0.8"/>
  <text x="600" y="577" font-family="system-ui, sans-serif" font-size="14" fill="#ccfbf1" text-anchor="middle" font-weight="600">thecrawli.com</text>
</svg>
