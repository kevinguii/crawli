<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Clock icon">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Clock face -->
  <circle cx="600" cy="315" r="220" fill="#fff7ed"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#ea580c" stroke-width="10"/>

  <!-- Hour tick marks -->
  <g stroke="#fed7aa" stroke-width="3" stroke-linecap="round">
    <line x1="600" y1="102" x2="600" y2="126"/>
    <line x1="710" y1="124" x2="698" y2="145"/>
    <line x1="796" y1="190" x2="780" y2="206"/>
    <line x1="848" y1="285" x2="824" y2="291"/>
    <line x1="848" y1="345" x2="824" y2="339"/>
    <line x1="796" y1="440" x2="780" y2="424"/>
    <line x1="710" y1="506" x2="698" y2="485"/>
    <line x1="600" y1="528" x2="600" y2="504"/>
    <line x1="490" y1="506" x2="502" y2="485"/>
    <line x1="404" y1="440" x2="420" y2="424"/>
    <line x1="404" y1="190" x2="420" y2="206"/>
    <line x1="490" y1="124" x2="502" y2="145"/>
  </g>

  <!-- Peak arc: 7pm to 9pm zone -->
  <path d="M 490 505 A 220 220 0 0 1 380 315" fill="none" stroke="#ea580c" stroke-width="28" stroke-linecap="round" opacity="0.25"/>

  <!-- Hour hand: ~8 o'clock -->
  <line x1="600" y1="315" x2="487" y2="380" stroke="#c2410c" stroke-width="12" stroke-linecap="round"/>

  <!-- Minute hand: 12 -->
  <line x1="600" y1="315" x2="600" y2="130" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="600" cy="315" r="12" fill="#c2410c"/>
</svg>
