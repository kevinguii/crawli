<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#164e63"/>
  <!-- Wave pattern background -->
  <path d="M0 200 Q150 160 300 200 Q450 240 600 200 Q750 160 900 200 Q1050 240 1200 200 L1200 0 L0 0Z" fill="#1e6680" opacity="0.4"/>
  <path d="M0 350 Q200 310 400 350 Q600 390 800 350 Q1000 310 1200 350 L1200 500 Q1000 540 800 500 Q600 460 400 500 Q200 540 0 500Z" fill="#0f3f52" opacity="0.5"/>
  <!-- Knit stitch pattern lines -->
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#0e7490" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="440" x2="1200" y2="440" stroke="#0e7490" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#0e7490" stroke-width="1.5" opacity="0.3"/>
  <!-- Cable knit V shapes -->
  <path d="M80 100 L110 140 L140 100" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M80 140 L110 180 L140 140" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M1060 100 L1090 140 L1120 100" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M1060 140 L1090 180 L1120 140" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Anchor symbol -->
  <circle cx="600" cy="160" r="28" stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.5"/>
  <line x1="600" y1="132" x2="600" y2="188" stroke="#7dd3fc" stroke-width="3" opacity="0.5"/>
  <path d="M572 152 Q600 140 628 152" stroke="#7dd3fc" stroke-width="2.5" fill="none" opacity="0.5"/>
  <!-- Text -->
  <text x="600" y="290" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#f0f9ff" text-anchor="middle" letter-spacing="-1">The Fisherman Sweater</text>
  <text x="600" y="355" font-family="Georgia, serif" font-size="30" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">Was Never Meant to Be Fashion</text>
  <text x="600" y="410" font-family="Georgia, serif" font-size="22" fill="#bae6fd" text-anchor="middle" opacity="0.85">It was sea-proof armor for the North Atlantic</text>
  <!-- Crawli badge -->
  <rect x="530" y="545" width="140" height="36" rx="18" fill="#0e7490" opacity="0.7"/>
  <text x="600" y="568" font-family="system-ui, sans-serif" font-size="14" fill="#e0f2fe" text-anchor="middle" font-weight="600">thecrawli.com</text>
</svg>
