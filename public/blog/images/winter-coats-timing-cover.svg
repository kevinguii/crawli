<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Winter coat on a hanger with a calendar mark">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Halo -->
  <circle cx="600" cy="315" r="220" fill="#f0f9ff"/>

  <!-- Hanger hook -->
  <path d="M 600 150 L 600 185 Q 600 200 615 200" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Hanger bar -->
  <line x1="500" y1="220" x2="700" y2="220" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

  <!-- Coat body -->
  <path d="M 480 240 L 540 220 L 600 235 L 660 220 L 720 240 L 745 320 L 700 340 L 690 460 L 510 460 L 500 340 L 455 320 Z"
        fill="none" stroke="#1e3a8a" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Coat collar -->
  <path d="M 560 235 L 600 270 L 640 235" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Buttons -->
  <circle cx="600" cy="300" r="7" fill="#1e3a8a" opacity="0.6"/>
  <circle cx="600" cy="345" r="7" fill="#1e3a8a" opacity="0.6"/>
  <circle cx="600" cy="390" r="7" fill="#1e3a8a" opacity="0.6"/>

  <!-- Small calendar mark, lower right of halo -->
  <rect x="755" y="395" width="80" height="70" rx="8" fill="none" stroke="#1e3a8a" stroke-width="8"/>
  <line x1="755" y1="420" x2="835" y2="420" stroke="#1e3a8a" stroke-width="8"/>
  <line x1="775" y1="382" x2="775" y2="400" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
  <line x1="815" y1="382" x2="815" y2="400" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
</svg>
